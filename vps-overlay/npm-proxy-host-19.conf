# ------------------------------------------------------------
# directo.apliarte.com
# ------------------------------------------------------------



map $scheme $hsts_header {
    https   "max-age=63072000; preload";
}

server {
  set $forward_scheme http;
  set $server         "172.20.0.1";
  set $port           7979;

  listen 80;
listen [::]:80;
listen 443 ssl;
listen [::]:443 ssl;


  server_name directo.apliarte.com;
  # Seguridad: Solo Tailscale y redes privadas autorizadas
  allow 100.64.0.0/10;
  allow 198.51.100.1; # IP de confianza (ejemplo)
  allow 127.0.0.1;
  allow 172.16.0.0/12;
  allow 10.0.0.0/8;
  allow 192.168.0.0/16;
  # deny all;


http2 off;


  # Let's Encrypt SSL
  include conf.d/include/letsencrypt-acme-challenge.conf;
  include conf.d/include/ssl-cache.conf;
  include conf.d/include/ssl-ciphers.conf;
  ssl_certificate /etc/letsencrypt/live/npm-72/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/npm-72/privkey.pem;











proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $http_connection;
proxy_http_version 1.1;


  access_log /data/logs/proxy-host-19_access.log proxy;
  error_log /data/logs/proxy-host-19_error.log warn;

location /ws {
    # Mic audio and live data travel here: only home (OBS) and Tailscale.
    allow 198.51.100.1; # IP de confianza (ejemplo)
    allow 100.64.0.0/10;
    allow 127.0.0.1;
    allow 172.16.0.0/12;
    deny all;
    proxy_pass http://172.20.0.1:7979;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 86400;
    proxy_send_timeout 86400;
}





  # 2026-09-26 emergency (Javier): the control panel is private. Public domain shows
  # only the 3D showcase; admin/mic/SMS/walk/commands only via Tailscale:
  # http://TU_IP_TAILSCALE:7979/admin
  location ~* ^/(admin|admin\.html|directo|sms|sms\.html|walk|walk\.html|panel-twitch-comandos\.html)/?$ {
    return 404;
  }
  # Root and /index.html served the admin panel to everyone; proxy them to the
  # public 3D showcase (/plano). NPM's proxy.conf forwards $request_uri, so a
  # rewrite is not enough. Query args are kept: OBS ?transparente=1 still works.
  location = / {
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_pass http://172.20.0.1:7979/plano$is_args$args;
  }
  location = /index.html {
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_pass http://172.20.0.1:7979/plano$is_args$args;
  }

  # 2026-09-26: control APIs are private. Publicly only the two read calls the
  # 3D showcase/OBS needs; SMS only home (OBS) + Tailscale; everything else 404.
  location ^~ /api/ {
    return 404;
  }
  location = /api/directo/comando {
    # 2026-09-26: its GET payload carries the camera room/stream/password (Codex review).
    allow 198.51.100.1; # IP de confianza (ejemplo)
    allow 100.64.0.0/10;
    deny all;
    limit_except GET { deny all; }
    include conf.d/include/proxy.conf;
  }
  location = /api/panel/voces {
    limit_except GET { deny all; }
    include conf.d/include/proxy.conf;
  }
  # OBS overlay reads this (home IP) — read-only, home + Tailscale.
  location = /api/categoria {
    allow 198.51.100.1; # IP de confianza (ejemplo)
    allow 100.64.0.0/10;
    deny all;
    # OBS saves chat !claro/!oscuro and category changes with POST (home only).
    limit_except GET POST { deny all; }
    include conf.d/include/proxy.conf;
  }
  # OBS overlay reads this (home IP) — read-only, home + Tailscale.
  location = /api/directo/juego/estado {
    allow 198.51.100.1; # IP de confianza (ejemplo)
    allow 100.64.0.0/10;
    deny all;
    limit_except GET { deny all; }
    include conf.d/include/proxy.conf;
  }
  # OBS overlay reads this (home IP) — read-only, home + Tailscale.
  location = /api/tts {
    allow 198.51.100.1; # IP de confianza (ejemplo)
    allow 100.64.0.0/10;
    deny all;
    limit_except GET { deny all; }
    include conf.d/include/proxy.conf;
  }
  # Camera config for the OBS overlay (room/stream/password): home + Tailscale only.
  location = /api/directo/camara/config {
    allow 198.51.100.1; # IP de confianza (ejemplo)
    allow 100.64.0.0/10;
    deny all;
    limit_except GET { deny all; }
    include conf.d/include/proxy.conf;
  }
  location = /api/directo/sms {
    allow 198.51.100.1; # IP de confianza (ejemplo)
    allow 100.64.0.0/10;
    deny all;
    # OBS (home) stores viewers' !sms with POST; the allow/deny above still applies.
    limit_except GET POST { deny all; }
    # 2026-09-26: server trusts client X-Forwarded-For (spoofable 127.0.0.1 = auth).
    # Send only the real peer address so nobody on the home Wi-Fi can read SMS.
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_pass $forward_scheme://$server:$port$request_uri;
  }

  # Legacy public cockpit stays disabled; private use goes through Tailscale.
  location ~* ^/(control|control-login) {
    return 404;
  }

  location / {






    
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $http_connection;
    proxy_http_version 1.1;
    

    # Proxy!
    # 2026-09-26 (Codex audit, confirmed by Claude): server.js trusts client
    # X-Forwarded-For; forward only the real peer address, never the client's.
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_pass $forward_scheme://$server:$port$request_uri;
  }


  # Custom
  include /data/nginx/custom/server_proxy[.]conf;
}
