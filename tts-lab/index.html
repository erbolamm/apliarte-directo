<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Laboratorio TTS · ApliArte</title>
<style>
:root{font-family:system-ui,sans-serif;color-scheme:light;--bg:#f6f8fb;--panel:#fff;--ink:#172437;--line:#ccd5df} :root[data-theme=dark]{color-scheme:dark;--bg:#111923;--panel:#1c2936;--ink:#eef4fa;--line:#526374}
*{box-sizing:border-box} body{background:var(--bg);color:var(--ink);margin:0} main{max-width:650px;margin:24px auto;padding:8px} header{display:flex;justify-content:space-between;align-items:center} h1{font-size:1.5rem} label{display:block;margin:12px 0} input,select,textarea,button{font:inherit;background:var(--panel);color:var(--ink);border:1px solid var(--line);padding:8px} select,textarea{display:block;width:100%} textarea{min-height:100px} button{cursor:pointer} .icon{font-size:1.4rem;position:relative}.icon::after{content:attr(data-tip);position:absolute;top:100%;right:0;padding:8px;background:var(--ink);color:var(--bg);font-size:.8rem;white-space:nowrap;opacity:0;visibility:hidden;transition:opacity .1s 3s,visibility 0s 3s}.icon:hover::after,.icon:focus-visible::after{opacity:1;visibility:visible} audio{width:100%;margin:16px 0}
</style></head><body><main><header><h1>Laboratorio TTS aislado</h1><button class="icon" id="theme" type="button" aria-label="Cambiar tema" data-tip="Cambiar entre modo claro y oscuro">☾</button></header>
<p>Prueba local: Piper necesita un modelo en <code>models/</code>; eSpeak NG funciona sin descargar voces. Edge requiere Internet y está excluido del catálogo libre. Ningún motor se conecta al directo.</p>
<form id="form"><label>Motor<select name="engine"><option value="piper">Piper local</option><option value="espeak">eSpeak NG local</option><option value="edge">Edge TTS (solo comparación; excluido)</option></select></label><label>Voz<select name="voice"></select></label><label>Texto<textarea name="text" maxlength="500" required>Hola, esta es una prueba de voz antes del directo.</textarea></label><label>Tono independiente de velocidad (solo Edge): <output id="pitch-value">0 Hz</output><input name="pitch_hz" type="range" min="-100" max="100" value="0"></label><button type="submit">Generar audio</button></form><p id="status" role="status"></p><audio id="audio" controls></audio></main>
<script>
const root=document.documentElement, form=document.getElementById('form'), audio=document.getElementById('audio'), status=document.getElementById('status'); let audioUrl;
const VOICES={edge:[['es-ES-ElviraNeural','España · Elvira'],['es-ES-AlvaroNeural','España · Álvaro'],['es-MX-DaliaNeural','México · Dalia'],['es-MX-JorgeNeural','México · Jorge'],['es-AR-ElenaNeural','Argentina · Elena'],['es-AR-TomasNeural','Argentina · Tomás'],['es-CO-SalomeNeural','Colombia · Salomé'],['es-CO-GonzaloNeural','Colombia · Gonzalo']],piper:[['es_ES-davefx-medium','España · davefx (CC0)'],['es_MX-ald-medium','México · ald (Unlicense)'],['es_MX-claude-high','México · claude (Apache-2.0)'],['es_AR-daniela-high','Argentina · daniela (CC BY-SA 4.0)']],espeak:[['es','Español de España (genérico)'],['es-419','Español latinoamericano (genérico)'],['ca','Catalán'],['eu','Euskera'],['pt','Portugués de Portugal'],['ja','Japonés']]};
function fillVoices(){form.elements.voice.innerHTML=VOICES[form.elements.engine.value].map(([id,label])=>`<option value="${id}">${label}</option>`).join('')}
fillVoices();
document.getElementById('theme').addEventListener('click',()=>{root.dataset.theme=root.dataset.theme==='dark'?'light':'dark';document.getElementById('theme').textContent=root.dataset.theme==='dark'?'☀':'☾'});
form.elements.pitch_hz.addEventListener('input',()=>document.getElementById('pitch-value').textContent=`${form.elements.pitch_hz.value} Hz`);
form.elements.engine.addEventListener('change',()=>{fillVoices();form.elements.pitch_hz.disabled=form.elements.engine.value!=='edge';if(form.elements.pitch_hz.disabled){form.elements.pitch_hz.value='0';document.getElementById('pitch-value').textContent='0 Hz'}});
form.elements.engine.dispatchEvent(new Event('change'));
form.addEventListener('submit',async event=>{event.preventDefault();status.textContent='Generando audio…';try{const response=await fetch('/synthesize',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({engine:form.elements.engine.value,voice:form.elements.voice.value,text:form.elements.text.value,pitch_hz:Number(form.elements.pitch_hz.value)})});if(!response.ok)throw Error(await response.text());const blob=await response.blob();if(audioUrl)URL.revokeObjectURL(audioUrl);audioUrl=URL.createObjectURL(blob);audio.src=audioUrl;status.textContent='Audio listo.'}catch(error){status.textContent=error.message}});
</script></body></html>
