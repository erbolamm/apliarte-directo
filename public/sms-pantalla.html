<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>ApliArte Directo · Mensaje en pantalla</title>
  <style>
    /* OBS browser source, 1920×1080, transparent. It shows the one SMS that
       was chosen in the studio panel, along the bottom of the picture. */
    :root {
      --brand: #005fa9;
      --brand-strong: #0284c7;
      --panel: #090d16;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --on-brand: #ffffff;
      --font: Inter, "DejaVu Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    /* Follows the light or dark mode of the stream, like the other layers. */
    html[data-theme="light"] {
      --brand-strong: #005fa9;
      --panel: #ffffff;
      --text: #1e293b;
      --muted: #5b6b82;
    }
    html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
    body { font-family: var(--font); color: var(--text); }
    .message {
      position: fixed;
      left: 4vw;
      right: 4vw;
      bottom: 5vh;
      display: flex;
      align-items: center;
      gap: 2vw;
      padding: 2vh 2vw;
      border-left: 0.6vw solid var(--brand-strong);
      border-radius: 1.2vh;
      background: var(--panel);
      opacity: 0;
      transform: translateY(3vh);
      transition: opacity 0.35s ease, transform 0.35s ease;
      color: var(--text);
    }
    .message.visible { opacity: 1; transform: none; }
    .avatar {
      flex: none;
      width: 11vh;
      height: 11vh;
      border-radius: 50%;
      overflow: hidden;
      display: grid;
      place-items: center;
      background: var(--brand);
      color: var(--on-brand);
      font-size: 6vh;
      font-weight: 700;
    }
    .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .content { min-width: 0; }
    .user { font-size: calc(3.2vh * var(--zoom-sms, 1)); font-weight: 700; color: var(--brand-strong); }
    .text { font-size: calc(4.4vh * var(--zoom-sms, 1)); line-height: 1.25; overflow-wrap: anywhere; }
    .controles-zoom {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      margin-left: auto;
      opacity: 0.15;
      transition: opacity 0.2s ease;
      flex-shrink: 0;
      user-select: none;
      pointer-events: auto;
    }
    .message:hover .controles-zoom,
    .controles-zoom:hover,
    .controles-zoom:focus-within {
      opacity: 0.95;
    }
    .btn-zoom {
      width: 4vh;
      height: 4vh;
      min-width: 24px;
      min-height: 24px;
      padding: 0;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 0.8vh;
      color: var(--text);
      font-size: 2.6vh;
      font-weight: 700;
      line-height: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.15s ease, transform 0.1s ease;
    }
    .btn-zoom:hover {
      background: rgba(255, 255, 255, 0.25);
      transform: scale(1.1);
    }
    .btn-zoom:active {
      transform: scale(0.92);
    }
    @media (prefers-reduced-motion: reduce) { .message { transition: none; } }
  </style>
</head>
<body>
  <div class="message" id="message" aria-live="polite">
    <div class="avatar" id="avatar"></div>
    <div class="content">
      <div class="user" id="user"></div>
      <div class="text" id="text"></div>
    </div>
    <div class="controles-zoom" id="controles-zoom" aria-label="Ajustar tamaño de texto">
      <button type="button" class="btn-zoom" id="btn-zoom-menos" title="Disminuir texto" aria-label="Disminuir tamaño de texto">−</button>
      <button type="button" class="btn-zoom" id="btn-zoom-mas" title="Aumentar texto" aria-label="Aumentar tamaño de texto">+</button>
    </div>
  </div>

  <script>
  (() => {
    'use strict';
    const POLL_MS = 1500;
    const THEME_POLL_MS = 3000;
    const message = document.getElementById('message');
    const avatar = document.getElementById('avatar');
    const user = document.getElementById('user');
    const text = document.getElementById('text');
    let shownId = null;

    const CLAVE_ZOOM = 'erbolamm-zoom-sms';
    let zoomNivel = 1;
    try {
      const z = parseFloat(localStorage.getItem(CLAVE_ZOOM));
      if (!isNaN(z) && z >= 0.5 && z <= 3) zoomNivel = z;
    } catch (_) {}
    function aplicarZoom(z) {
      zoomNivel = Math.max(0.5, Math.min(3, Math.round(z * 100) / 100));
      document.documentElement.style.setProperty('--zoom-sms', String(zoomNivel));
      try { localStorage.setItem(CLAVE_ZOOM, String(zoomNivel)); } catch (_) {}
    }
    aplicarZoom(zoomNivel);

    const btnMenos = document.getElementById('btn-zoom-menos');
    const btnMas = document.getElementById('btn-zoom-mas');
    if (btnMenos) btnMenos.addEventListener('click', (e) => { e.stopPropagation(); aplicarZoom(zoomNivel - 0.1); });
    if (btnMas) btnMas.addEventListener('click', (e) => { e.stopPropagation(); aplicarZoom(zoomNivel + 0.1); });

    function paintAvatar(name, url) {
      avatar.replaceChildren();
      const initial = (String(name || '?').trim().charAt(0) || '?').toUpperCase();
      if (!url) { avatar.textContent = initial; return; }
      const image = document.createElement('img');
      image.alt = '';
      // A picture that fails to load falls back to the initial.
      image.addEventListener('error', () => { avatar.replaceChildren(); avatar.textContent = initial; });
      image.src = url;
      avatar.appendChild(image);
    }

    function render(data) {
      if (!data) {
        shownId = null;
        message.classList.remove('visible');
        return;
      }
      if (data.id !== shownId) {
        shownId = data.id;
        user.textContent = '@' + data.usuario;
        text.textContent = data.texto;
        paintAvatar(data.usuario, data.avatar);
      }
      message.classList.add('visible');
    }

    async function poll() {
      try {
        const response = await fetch('/api/directo/sms/pantalla', { cache: 'no-store' });
        // A failed poll leaves the picture as it is; only a real answer changes it.
        if (response.ok) render((await response.json()).mensaje || null);
      } catch (_) { /* server restarting: try again on the next tick */ }
      setTimeout(poll, POLL_MS);
    }
    // The stream's mode is the one set in the panel (Escenario → modo del
    // diorama); an unknown answer keeps the current look.
    async function pollTheme() {
      try {
        const response = await fetch('/api/categoria', { cache: 'no-store' });
        if (response.ok) {
          const mode = (await response.json()).modo;
          if (mode === 'light' || mode === 'dark') document.documentElement.dataset.theme = mode;
        }
      } catch (_) { /* keep the current look */ }
      setTimeout(pollTheme, THEME_POLL_MS);
    }
    pollTheme();
    poll();
  })();
  </script>
</body>
</html>
