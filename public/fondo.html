<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ApliArte – Fondo Dinámico Temático</title>
  <style>
    :root {
      --color-primary: #5ecef5;
      --color-secondary: #00467b;
      --color-dark: #0c4a6e;
      --bg-base: #0c4a6e;

      /* Andando (verde paseo) */
      --sky-top: #15803d;
      --sky-bottom: #052e16;
      --sky-shape: #00e676;
      --sky-line: #00c853;

      /* Apps (código ApliArte). Lifted off near-black so OBS does not key the frame as empty. */
      --code-top: #1d6fad;
      --code-bottom: #0c4a6e;
      --code-c1: #5ecef5;
      --code-c2: #00467b;

      /* Arte (Calca / dibujo) */
      --art-top: #1a0f0b;
      --art-bottom: #2d1710;
      --art-brush: #f5cba7;
      --art-blob: #3e2723;

      /* Música */
      --music-top: #260519;
      --music-bottom: #14020c;
      --music-wave1: #ff1493;
      --music-wave2: #e91e63;

      /* Charlando */
      --chat-top: #1c1208;
      --chat-bottom: #0f0904;
      --chat-glow: #e8955e;
      --chat-lamp: #b46734;

      /* Overlays */
      --grid-line: rgba(255, 255, 255, 0.05);
      --vignette-color: rgba(0, 0, 0, 0.28);
    }

    html[data-theme="light"], :root[data-theme="light"] {
      --bg-base: linear-gradient(135deg, #f0f4f8 0%, #e2e8f0 50%, #cbd5e1 100%);

      /* Andando */
      --sky-top: #e8f5e9;
      --sky-bottom: #c8e6c9;
      --sky-shape: #1b5e20;
      --sky-line: #2e7d32;

      /* Apps */
      --code-top: #f0f4f8;
      --code-bottom: #e2e8f0;
      --code-c1: #005fa9;
      --code-c2: #0284c7;

      /* Arte */
      --art-top: #fdfbf7;
      --art-bottom: #f5ede0;
      --art-brush: #a1887f;
      --art-blob: #d7ccc8;

      /* Música */
      --music-top: #fdf2f8;
      --music-bottom: #fce7f3;
      --music-wave1: #d81b60;
      --music-wave2: #e91e63;

      /* Charlando */
      --chat-top: #fef9f5;
      --chat-bottom: #faece1;
      --chat-glow: #b46734;
      --chat-lamp: #d7a176;

      /* Overlays */
      --grid-line: rgba(0, 0, 0, 0.04);
      --vignette-color: rgba(15, 23, 42, 0.25);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      background-color: #0c4a6e;
    }

    body {
      overflow: hidden;
      width: 1920px;
      height: 1080px;
      user-select: none;
    }

    #bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #0c4a6e;
      background-image: linear-gradient(180deg, #1d6fad 0%, #0c4a6e 55%, #083556 100%);
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
      transition: background 1.5s ease-in-out;
    }

    .fondo-tematico {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      pointer-events: none;
      transition: opacity 1.5s ease-in-out;
      will-change: opacity;
    }

    .fondo-tematico.activa {
      opacity: 1;
    }

    .fondo-tematico svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Pausa automática de capas inactivas para ahorrar 100% de CPU/GPU */
    .fondo-tematico:not(.activa) * {
      animation-play-state: paused !important;
    }

    @media (prefers-reduced-motion: reduce) {
      .fondo-tematico * {
        animation: none !important;
      }
    }

    /* ── Animaciones temáticas ultra-lentas ── */
    @keyframes scrollSkyline {
      0%   { transform: translateX(0); }
      100% { transform: translateX(-1920px); }
    }
    @keyframes pulseFarola {
      0%, 100% { opacity: 0.15; }
      50%      { opacity: 0.35; }
    }
    @keyframes floatCode {
      0%   { transform: translateY(0); }
      100% { transform: translateY(-700px); }
    }
    @keyframes floatBrush {
      0%   { transform: translate(0, 0) rotate(0deg); }
      50%  { transform: translate(35px, -20px) rotate(2.5deg); }
      100% { transform: translate(0, 0) rotate(0deg); }
    }
    @keyframes waveShift {
      0%   { transform: translateX(0); }
      100% { transform: translateX(-960px); }
    }
    @keyframes eqBar1 {
      0%, 100% { transform: scaleY(0.6); }
      50%      { transform: scaleY(1.15); }
    }
    @keyframes eqBar2 {
      0%, 100% { transform: scaleY(1.05); }
      50%      { transform: scaleY(0.55); }
    }
    @keyframes eqBar3 {
      0%, 100% { transform: scaleY(0.75); }
      50%      { transform: scaleY(1.25); }
    }
    @keyframes riseVapor {
      0%   { transform: translateY(0) scaleX(1); opacity: 0; }
      30%  { opacity: 0.25; }
      80%  { opacity: 0.15; }
      100% { transform: translateY(-250px) scaleX(1.3); opacity: 0; }
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.15; }
      50%      { opacity: 0.28; }
    }

    .grid-overlay {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(var(--grid-line) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
      background-size: 60px 60px;
      pointer-events: none;
      z-index: 1;
      transition: background 1.5s ease-in-out;
    }

    /* OBS Browser Source drops var() inside SVG presentation attributes.
       Literal stop/fill colors below keep every theme visible with no WebSocket.
       Light mode overrides the same paints from [data-theme="light"]. */
    #skyGrad stop:nth-child(1) { stop-color: #15803d; }
    #skyGrad stop:nth-child(2) { stop-color: #052e16; }
    #codeGrad stop:nth-child(1) { stop-color: #1d6fad; }
    #codeGrad stop:nth-child(2) { stop-color: #0c4a6e; }
    #artGrad stop:nth-child(1) { stop-color: #6b3a2a; }
    #artGrad stop:nth-child(2) { stop-color: #3e241c; }
    #musicGrad stop:nth-child(1) { stop-color: #9d174d; }
    #musicGrad stop:nth-child(2) { stop-color: #4a044e; }
    #talkGrad stop:nth-child(1) { stop-color: #9a3412; }
    #talkGrad stop:nth-child(2) { stop-color: #431407; }
    #fondo-andando [fill="var(--sky-shape)"] { fill: #4ade80; }
    #fondo-andando [stroke="var(--sky-line)"] { stroke: #86efac; }
    #fondo-apps [fill="var(--code-c1)"] { fill: #b9ecff; }
    #fondo-apps [fill="var(--code-c2)"] { fill: #7dd3fc; }
    #fondo-arte [stroke="var(--art-brush)"],
    #fondo-arte [fill="var(--art-brush)"] { stroke: #f5cba7; fill: #f5cba7; }
    #fondo-arte [fill="var(--art-blob)"] { fill: #e7c8b4; }
    #fondo-musica [stroke="var(--music-wave1)"],
    #fondo-musica [fill="var(--music-wave1)"] { stroke: #fb7185; fill: #fb7185; }
    #fondo-musica [stroke="var(--music-wave2)"] { stroke: #f9a8d4; }
    #fondo-charlando [stroke="var(--chat-lamp)"] { stroke: #fdba74; }
    #fondo-charlando [fill="var(--chat-glow)"] { fill: #fed7aa; }
    #fondo-charlando [stroke="var(--chat-glow)"] { stroke: #fdba74; }
    .personajes { fill: #f8fafc; }
    #fondo-apps .personajes { fill: #e0f2fe; }
    #fondo-andando .personajes { fill: #ecfccb; }
    #fondo-arte .personajes { fill: #fff7ed; }
    #fondo-musica .personajes { fill: #fce7f3; }
    #fondo-charlando .personajes { fill: #ffedd5; }

    html[data-theme="light"] #skyGrad stop:nth-child(1) { stop-color: #e8f5e9; }
    html[data-theme="light"] #skyGrad stop:nth-child(2) { stop-color: #c8e6c9; }
    html[data-theme="light"] #codeGrad stop:nth-child(1) { stop-color: #f0f4f8; }
    html[data-theme="light"] #codeGrad stop:nth-child(2) { stop-color: #e2e8f0; }
    html[data-theme="light"] #artGrad stop:nth-child(1) { stop-color: #fdfbf7; }
    html[data-theme="light"] #artGrad stop:nth-child(2) { stop-color: #f5ede0; }
    html[data-theme="light"] #musicGrad stop:nth-child(1) { stop-color: #fdf2f8; }
    html[data-theme="light"] #musicGrad stop:nth-child(2) { stop-color: #fce7f3; }
    html[data-theme="light"] #talkGrad stop:nth-child(1) { stop-color: #fef9f5; }
    html[data-theme="light"] #talkGrad stop:nth-child(2) { stop-color: #faece1; }
    html[data-theme="light"] .personajes { fill: #1e293b; }

    .vignette {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, transparent 55%, var(--vignette-color) 100%);
      pointer-events: none;
      z-index: 2;
      transition: background 1.5s ease-in-out;
    }
  </style>
</head>
<body>
  <div id="bg">
    <!-- 1. ANDANDO (IRL / Calle / Modo paseo) -->
    <div class="fondo-tematico" id="fondo-andando">

        <rect width="1920" height="1080" fill="url(#skyGrad)"/>

            <circle cx="180" cy="850" r="16" opacity="0.3"/>
            <circle cx="530" cy="850" r="16" opacity="0.3"/>
            <circle cx="980" cy="850" r="16" opacity="0.3"/>
            <circle cx="1340" cy="850" r="16" opacity="0.3"/>
            <circle cx="1790" cy="850" r="16" opacity="0.3"/>
          </g>
          <g transform="translate(1920, 0)">
            <g fill="var(--sky-shape)" opacity="0.42">
              <rect x="50" y="680" width="120" height="400" rx="4"/>
              <rect x="200" y="600" width="180" height="480" rx="4"/>
              <rect x="420" y="730" width="90" height="350" rx="4"/>
              <rect x="550" y="550" width="220" height="530" rx="4"/>
              <rect x="810" y="650" width="150" height="430" rx="4"/>
              <rect x="1000" y="590" width="170" height="490" rx="4"/>
              <rect x="1210" y="710" width="110" height="370" rx="4"/>
              <rect x="1360" y="520" width="240" height="560" rx="4"/>
              <rect x="1640" y="640" width="140" height="440" rx="4"/>
              <rect x="1810" y="690" width="100" height="390" rx="4"/>
            </g>
            <line x1="0" y1="920" x2="1920" y2="920" stroke="var(--sky-line)" stroke-width="2" opacity="0.25"/>
            <g fill="var(--sky-shape)" style="animation: pulseFarola 6s ease-in-out infinite;">
              <circle cx="180" cy="850" r="16" opacity="0.3"/>
              <circle cx="530" cy="850" r="16" opacity="0.3"/>
              <circle cx="980" cy="850" r="16" opacity="0.3"/>
              <circle cx="1340" cy="850" r="16" opacity="0.3"/>
              <circle cx="1790" cy="850" r="16" opacity="0.3"/>
            </g>

        <g class="personajes" style="animation: floatBrush 72s ease-in-out infinite;">
          <circle cx="700" cy="760" r="28"/>

          <rect x="1156" y="820" width="48" height="80" rx="18"/>
        </g>
      </svg>
    </div>

    <!-- 2. APPS (Código / ApliArte) -->

            <rect x="1500" y="330" width="190" height="12" rx="3"/>
            <rect x="1450" y="360" width="60" height="12" rx="3"/>

    <!-- 3. ARTE (Dibujo / Calca) -->

      <svg viewBox="0 0 1920 1080" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">

          <linearGradient id="artGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#6b3a2a"/>
            <stop offset="100%" stop-color="#3e241c"/>

        <rect width="1920" height="1080" fill="url(#artGrad)"/>

    <!-- 4. MÚSICA (Producción musical) -->
    <div class="fondo-tematico" id="fondo-musica">
      <svg viewBox="0 0 1920 1080" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="musicGrad" x1="0" y1="0" x2="0" y2="1">

          <rect x="280" y="-70" width="24" height="70" rx="3" style="transform-origin: 292px 0px; animation: eqBar3 15s ease-in-out infinite;"/>

          <circle cx="420" cy="700" r="28"/>
          <rect x="392" y="736" width="56" height="92" rx="20"/>
          <circle cx="1500" cy="720" r="24"/>

      </svg>
    </div>

    <!-- 5. CHARLANDO (Just Chatting / Tertulia / Café) -->
    <div class="fondo-tematico" id="fondo-charlando">
      <svg viewBox="0 0 1920 1080" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="talkGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#9a3412"/>
            <stop offset="100%" stop-color="#431407"/>
          </linearGradient>
          <radialGradient id="lampGlow" cx="0.5" cy="0.5" r="0.5">
            <stop offset="0%" stop-color="#fed7aa" stop-opacity="0.55"/>
            <stop offset="70%" stop-color="#fdba74" stop-opacity="0.22"/>
            <stop offset="100%" stop-color="#431407" stop-opacity="0"/>
          </radialGradient>
        </defs>
        <rect width="1920" height="1080" fill="url(#talkGrad)"/>
        <circle cx="280" cy="380" r="320" fill="url(#lampGlow)" style="animation: pulseGlow 14s ease-in-out infinite;"/>
        <g stroke="var(--chat-lamp)" stroke-width="3" fill="none" opacity="0.2">
          <path d="M 220 540 L 280 340 L 340 380 L 260 540"/>
          <path d="M 280 340 L 320 280"/>
          <path d="M 290 270 C 330 250, 370 290, 340 320 Z" fill="var(--chat-glow)" fill-opacity="0.15"/>
        </g>
        <g fill="none" stroke="var(--chat-glow)" stroke-width="4" stroke-linecap="round">
          <path d="M 1600 780 Q 1630 700, 1590 620 T 1620 480" style="animation: riseVapor 35s ease-in-out infinite;"/>
          <path d="M 1640 820 Q 1610 740, 1650 660 T 1630 520" style="animation: riseVapor 42s ease-in-out -15s infinite;"/>
        </g>
        <g class="personajes" style="animation: floatBrush 76s ease-in-out infinite;">
          <circle cx="900" cy="760" r="28"/>
          <rect x="872" y="796" width="56" height="92" rx="20"/>
          <circle cx="1220" cy="740" r="24"/>
          <rect x="1196" y="770" width="48" height="80" rx="18"/>

    <!-- 6. DAMAS 3D OVERLAY / ESCENARIO -->
    <div class="fondo-tematico" id="fondo-damas">
      <iframe src="/damas.html" title="Tablero 3D de Damas" style="width:100%;height:100%;border:none;pointer-events:auto;background:transparent;"></iframe>
    </div>

    <div class="grid-overlay"></div>
    <div class="vignette"></div>
  </div>

  <script>
    const PALETAS = {
      apps: { primario: '#5ecef5', secundario: '#00467b', oscuro: '#0c4a6e' },
      musica: { primario: '#ff1493', secundario: '#e91e63', oscuro: '#9d174d' },
      arte: { primario: '#f5cba7', secundario: '#3e2723', oscuro: '#6b3a2a' },
      andando: { primario: '#00e676', secundario: '#00c853', oscuro: '#15803d' },
      charlando: { primario: '#e8955e', secundario: '#b46734', oscuro: '#9a3412' },
      damas: { primario: '#5ecef5', secundario: '#00467b', oscuro: '#081d33' },
    };

    // Opaque frame for each theme. Painted even when the WebSocket never connects.
    const BASES = {
      dark: {
        apps: 'linear-gradient(180deg, #1d6fad 0%, #0c4a6e 55%, #083556 100%)',
        musica: 'linear-gradient(180deg, #be185d 0%, #4a044e 100%)',
        arte: 'linear-gradient(180deg, #a1624a 0%, #3e241c 100%)',
        andando: 'linear-gradient(180deg, #22c55e 0%, #052e16 100%)',
        charlando: 'linear-gradient(180deg, #ea580c 0%, #431407 100%)',
        damas: 'radial-gradient(circle at 50% 40%, #0e3b5e 0%, #071f33 100%)',
      },
      light: {
        apps: 'linear-gradient(180deg, #e0f2fe 0%, #bae6fd 100%)',
        musica: 'linear-gradient(180deg, #fce7f3 0%, #fbcfe8 100%)',
        arte: 'linear-gradient(180deg, #fff7ed 0%, #fed7aa 100%)',
        andando: 'linear-gradient(180deg, #dcfce7 0%, #86efac 100%)',
        charlando: 'linear-gradient(180deg, #ffedd5 0%, #fdba74 100%)',
        damas: 'radial-gradient(circle at 50% 40%, #e0f2fe 0%, #bae6fd 100%)',
      },
    };

    const urlParams = new URLSearchParams(window.location.search);
    let categoriaActual = (urlParams.get('damas') === '1' || urlParams.get('tablero') === 'damas' || urlParams.get('vista') === 'damas') ? 'damas' : 'apps';
    let modoActual = 'dark';

    function pintarBase(cat) {
      const grupo = BASES[modoActual] || BASES.dark;
      const imagen = grupo[cat] || grupo.apps;
      const bg = document.getElementById('bg');
      if (!bg || !imagen) return;
      bg.style.backgroundColor = PALETAS[cat] ? PALETAS[cat].oscuro : '#0c4a6e';
      bg.style.backgroundImage = imagen;
      document.documentElement.style.backgroundColor = bg.style.backgroundColor;
    }

    function aplicarPaleta(cat) {
      const p = PALETAS[cat];
      if (!p) return;
      categoriaActual = cat;
      const rootStyle = document.documentElement.style;
      rootStyle.setProperty('--color-primary', p.primario);
      rootStyle.setProperty('--color-secondary', p.secundario);
      rootStyle.setProperty('--color-dark', p.oscuro);
      pintarBase(cat);

      document.querySelectorAll('.fondo-tematico').forEach(el => {
        el.classList.toggle('activa', el.id === `fondo-${cat}`);
      });
    }

    function aplicarModo(modo) {
      const normalizado = (modo === 'light' || modo === 'claro' || modo === 'dia' || modo === 'día') ? 'light' : 'dark';
      modoActual = normalizado;
      document.documentElement.dataset.theme = normalizado;
      document.documentElement.setAttribute('data-theme', normalizado);
      pintarBase(categoriaActual);
    }

    aplicarPaleta(categoriaActual);
    aplicarModo(modoActual);

    // 1. WebSocket en tiempo real con el VPS
    function conectarWs() {
      const proto = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
      const host = window.location.host || 'directo.apliarte.com';
      const wsUrl = `${proto}//${host}/ws`;

      try {
        const ws = new WebSocket(wsUrl);
        ws.onmessage = (event) => {
          try {
            const data = JSON.parse(event.data);
            const cat = (data && (data.categoria || (data.tablero === 'damas' ? 'damas' : null)));
            if (cat && PALETAS[cat]) {
              aplicarPaleta(cat);
            }
            if (data && data.modo) {
              aplicarModo(data.modo);
            }
          } catch (_) {}
        };
        ws.onclose = () => {
          setTimeout(conectarWs, 3000);
        };
      } catch (_) {
        setTimeout(conectarWs, 5000);
      }
    }

    conectarWs();

    // 2. Polling de respaldo cada 2.5s por si el WebSocket se corta
    async function syncCategoria() {
      try {
        const res = await fetch('/api/categoria', { cache: 'no-store' });
        if (res && res.ok) {
          const data = await res.json();
          const cat = data && (data.categoria || (data.tablero === 'damas' ? 'damas' : null));
          if (cat && cat !== categoriaActual && PALETAS[cat]) {
            aplicarPaleta(cat);
          }
          if (data && data.modo && data.modo !== modoActual) {
            aplicarModo(data.modo);
          }
        }
      } catch (_) {}
    }

    setInterval(syncCategoria, 2500);
    syncCategoria();
  </script>
</body>
</html>
