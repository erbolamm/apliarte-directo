<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ApliArte – Fondo Dinámico Temático</title>
  <style>
    :root {
      --color-primary: #5ecef5;
      --color-secondary: #00467b;
      --color-dark: #030a16;
      --bg-base: var(--color-dark);

      /* Andando (verde paseo) */
      --sky-top: #0a3d1c;
      --sky-bottom: #031208;
      --sky-shape: #00e676;
      --sky-line: #00c853;

      /* Apps (código ApliArte) */
      --code-top: #030a16;
      --code-bottom: #001830;
      --code-c1: #5ecef5;
      --code-c2: #00467b;

      /* Arte (Calca / dibujo) */
      --art-top: #1a0f0b;
      --art-bottom: #2d1710;
      --art-brush: #f5cba7;
      --art-blob: #3e2723;

      /* Música */
      --music-top: #260519;
      --music-bottom: #14020c;
      --music-wave1: #ff1493;
      --music-wave2: #e91e63;

      /* Charlando */
      --chat-top: #1c1208;
      --chat-bottom: #0f0904;
      --chat-glow: #e8955e;
      --chat-lamp: #b46734;

      /* Overlays */
      --grid-line: rgba(255, 255, 255, 0.02);
      --vignette-color: rgba(0, 0, 0, 0.65);
    }

    html[data-theme="light"], :root[data-theme="light"] {
      --bg-base: linear-gradient(135deg, #f0f4f8 0%, #e2e8f0 50%, #cbd5e1 100%);

      /* Andando */
      --sky-top: #e8f5e9;
      --sky-bottom: #c8e6c9;
      --sky-shape: #1b5e20;
      --sky-line: #2e7d32;

      /* Apps */
      --code-top: #f0f4f8;
      --code-bottom: #e2e8f0;
      --code-c1: #005fa9;
      --code-c2: #0284c7;

      /* Arte */
      --art-top: #fdfbf7;
      --art-bottom: #f5ede0;
      --art-brush: #a1887f;
      --art-blob: #d7ccc8;

      /* Música */
      --music-top: #fdf2f8;
      --music-bottom: #fce7f3;
      --music-wave1: #d81b60;
      --music-wave2: #e91e63;

      /* Charlando */
      --chat-top: #fef9f5;
      --chat-bottom: #faece1;
      --chat-glow: #b46734;
      --chat-lamp: #d7a176;

      /* Overlays */
      --grid-line: rgba(0, 0, 0, 0.04);
      --vignette-color: rgba(15, 23, 42, 0.25);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: transparent;
      overflow: hidden;
      width: 1920px;
      height: 1080px;
      user-select: none;
    }

    #bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: var(--bg-base);
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
      transition: background 1.5s ease-in-out;
    }

    .fondo-tematico {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      pointer-events: none;
      transition: opacity 1.5s ease-in-out;
      will-change: opacity;
    }

    .fondo-tematico.activa {
      opacity: 1;
    }

    .fondo-tematico svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Pausa automática de capas inactivas para ahorrar 100% de CPU/GPU */
    .fondo-tematico:not(.activa) * {
      animation-play-state: paused !important;
    }

    @media (prefers-reduced-motion: reduce) {
      .fondo-tematico * {
        animation: none !important;
      }
    }

    /* ── Animaciones temáticas ultra-lentas ── */
    @keyframes scrollSkyline {
      0%   { transform: translateX(0); }
      100% { transform: translateX(-1920px); }
    }
    @keyframes pulseFarola {
      0%, 100% { opacity: 0.15; }
      50%      { opacity: 0.35; }
    }
    @keyframes floatCode {
      0%   { transform: translateY(0); }
      100% { transform: translateY(-700px); }
    }
    @keyframes floatBrush {
      0%   { transform: translate(0, 0) rotate(0deg); }
      50%  { transform: translate(35px, -20px) rotate(2.5deg); }
      100% { transform: translate(0, 0) rotate(0deg); }
    }
    @keyframes waveShift {
      0%   { transform: translateX(0); }
      100% { transform: translateX(-960px); }
    }
    @keyframes eqBar1 {
      0%, 100% { transform: scaleY(0.6); }
      50%      { transform: scaleY(1.15); }
    }
    @keyframes eqBar2 {
      0%, 100% { transform: scaleY(1.05); }
      50%      { transform: scaleY(0.55); }
    }
    @keyframes eqBar3 {
      0%, 100% { transform: scaleY(0.75); }
      50%      { transform: scaleY(1.25); }
    }
    @keyframes riseVapor {
      0%   { transform: translateY(0) scaleX(1); opacity: 0; }
      30%  { opacity: 0.25; }
      80%  { opacity: 0.15; }
      100% { transform: translateY(-250px) scaleX(1.3); opacity: 0; }
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.15; }
      50%      { opacity: 0.28; }
    }

    .grid-overlay {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(var(--grid-line) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
      background-size: 60px 60px;
      pointer-events: none;
      z-index: 1;
      transition: background 1.5s ease-in-out;
    }

    .vignette {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, transparent 40%, var(--vignette-color) 100%);
      pointer-events: none;
      z-index: 2;
      transition: background 1.5s ease-in-out;
    }
  </style>
</head>
<body>
  <div id="bg">
    <!-- 1. ANDANDO (IRL / Calle / Modo paseo) -->
    <div class="fondo-tematico" id="fondo-andando">
      <svg viewBox="0 0 1920 1080" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="var(--sky-top)"/>
            <stop offset="100%" stop-color="var(--sky-bottom)"/>
          </linearGradient>
          <pattern id="streetGrid" width="60" height="60" patternUnits="userSpaceOnUse">
            <path d="M 60 0 L 0 0 0 60" fill="none" stroke="var(--sky-line)" stroke-width="0.5" opacity="0.08"/>
          </pattern>
        </defs>
        <rect width="1920" height="1080" fill="url(#skyGrad)"/>
        <rect width="1920" height="1080" fill="url(#streetGrid)"/>
        <g style="animation: scrollSkyline 90s linear infinite;">
          <g fill="var(--sky-shape)" opacity="0.14">
            <rect x="50" y="680" width="120" height="400" rx="4"/>
            <rect x="200" y="600" width="180" height="480" rx="4"/>
            <rect x="420" y="730" width="90" height="350" rx="4"/>
            <rect x="550" y="550" width="220" height="530" rx="4"/>
            <rect x="810" y="650" width="150" height="430" rx="4"/>
            <rect x="1000" y="590" width="170" height="490" rx="4"/>
            <rect x="1210" y="710" width="110" height="370" rx="4"/>
            <rect x="1360" y="520" width="240" height="560" rx="4"/>
            <rect x="1640" y="640" width="140" height="440" rx="4"/>
            <rect x="1810" y="690" width="100" height="390" rx="4"/>
          </g>
          <line x1="0" y1="920" x2="1920" y2="920" stroke="var(--sky-line)" stroke-width="2" opacity="0.25"/>
          <g fill="var(--sky-shape)" style="animation: pulseFarola 6s ease-in-out infinite;">
            <circle cx="180" cy="850" r="16" opacity="0.3"/>
            <circle cx="530" cy="850" r="16" opacity="0.3"/>
            <circle cx="980" cy="850" r="16" opacity="0.3"/>
            <circle cx="1340" cy="850" r="16" opacity="0.3"/>
            <circle cx="1790" cy="850" r="16" opacity="0.3"/>
          </g>
          <g transform="translate(1920, 0)">
            <g fill="var(--sky-shape)" opacity="0.14">
              <rect x="50" y="680" width="120" height="400" rx="4"/>
              <rect x="200" y="600" width="180" height="480" rx="4"/>
              <rect x="420" y="730" width="90" height="350" rx="4"/>
              <rect x="550" y="550" width="220" height="530" rx="4"/>
              <rect x="810" y="650" width="150" height="430" rx="4"/>
              <rect x="1000" y="590" width="170" height="490" rx="4"/>
              <rect x="1210" y="710" width="110" height="370" rx="4"/>
              <rect x="1360" y="520" width="240" height="560" rx="4"/>
              <rect x="1640" y="640" width="140" height="440" rx="4"/>
              <rect x="1810" y="690" width="100" height="390" rx="4"/>
            </g>
            <line x1="0" y1="920" x2="1920" y2="920" stroke="var(--sky-line)" stroke-width="2" opacity="0.25"/>
            <g fill="var(--sky-shape)" style="animation: pulseFarola 6s ease-in-out infinite;">
              <circle cx="180" cy="850" r="16" opacity="0.3"/>
              <circle cx="530" cy="850" r="16" opacity="0.3"/>
              <circle cx="980" cy="850" r="16" opacity="0.3"/>
              <circle cx="1340" cy="850" r="16" opacity="0.3"/>
              <circle cx="1790" cy="850" r="16" opacity="0.3"/>
            </g>
          </g>
        </g>
      </svg>
    </div>

    <!-- 2. APPS (Código / ApliArte) -->

            <stop offset="100%" stop-color="var(--code-bottom)"/>
          </linearGradient>
        </defs>
        <rect width="1920" height="1080" fill="url(#codeGrad)"/>
        <g style="animation: floatCode 65s linear infinite;">
          <g fill="var(--code-c1)" opacity="0.18">
            <rect x="120" y="300" width="80" height="12" rx="3"/>
            <rect x="220" y="300" width="140" height="12" rx="3"/>
            <rect x="160" y="330" width="220" height="12" rx="3"/>
            <rect x="200" y="360" width="90" height="12" rx="3"/>
            <rect x="310" y="360" width="130" height="12" rx="3"/>
            <rect x="160" y="390" width="160" height="12" rx="3"/>
            <rect x="120" y="420" width="40" height="12" rx="3"/>

            <rect x="120" y="580" width="110" height="12" rx="3"/>
            <rect x="160" y="610" width="190" height="12" rx="3"/>
            <rect x="160" y="640" width="130" height="12" rx="3"/>
            <rect x="120" y="670" width="50" height="12" rx="3"/>

            <rect x="120" y="850" width="90" height="12" rx="3"/>
            <rect x="160" y="880" width="240" height="12" rx="3"/>
            <rect x="200" y="910" width="110" height="12" rx="3"/>
            <rect x="160" y="940" width="170" height="12" rx="3"/>
            <rect x="120" y="970" width="60" height="12" rx="3"/>

            <rect x="120" y="1050" width="80" height="12" rx="3"/>
            <rect x="220" y="1050" width="140" height="12" rx="3"/>
            <rect x="160" y="1080" width="220" height="12" rx="3"/>
            <rect x="200" y="1110" width="90" height="12" rx="3"/>
            <rect x="310" y="1110" width="130" height="12" rx="3"/>
            <rect x="160" y="1140" width="160" height="12" rx="3"/>
            <rect x="120" y="1170" width="40" height="12" rx="3"/>
          </g>
          <g fill="var(--code-c2)" opacity="0.25">
            <rect x="1450" y="240" width="130" height="12" rx="3"/>
            <rect x="1500" y="270" width="260" height="12" rx="3"/>
            <rect x="1540" y="300" width="140" height="12" rx="3"/>
            <rect x="1500" y="330" width="190" height="12" rx="3"/>
            <rect x="1450" y="360" width="60" height="12" rx="3"/>

            <rect x="1450" y="520" width="100" height="12" rx="3"/>
            <rect x="1500" y="550" width="220" height="12" rx="3"/>
            <rect x="1500" y="580" width="150" height="12" rx="3"/>
            <rect x="1450" y="610" width="70" height="12" rx="3"/>

            <rect x="1450" y="780" width="120" height="12" rx="3"/>
            <rect x="1500" y="810" width="240" height="12" rx="3"/>
            <rect x="1540" y="840" width="110" height="12" rx="3"/>
            <rect x="1450" y="870" width="50" height="12" rx="3"/>

            <rect x="1450" y="990" width="130" height="12" rx="3"/>
            <rect x="1500" y="1020" width="260" height="12" rx="3"/>
            <rect x="1540" y="1050" width="140" height="12" rx="3"/>
            <rect x="1500" y="1080" width="190" height="12" rx="3"/>
            <rect x="1450" y="1110" width="60" height="12" rx="3"/>
          </g>
        </g>
      </svg>
    </div>

    <!-- 3. ARTE (Dibujo / Calca) -->
    <div class="fondo-tematico" id="fondo-arte">
      <svg viewBox="0 0 1920 1080" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="artGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="var(--art-top)"/>
            <stop offset="100%" stop-color="var(--art-bottom)"/>
          </linearGradient>
        </defs>
        <rect width="1920" height="1080" fill="url(#artGrad)"/>
        <g style="animation: floatBrush 80s ease-in-out infinite;">
          <path d="M-100 350 C 300 200, 600 550, 1050 380 S 1650 200, 2050 420" fill="none" stroke="var(--art-brush)" stroke-width="28" stroke-linecap="round" opacity="0.14"/>
          <path d="M-50 680 C 400 820, 850 500, 1300 750 S 1850 650, 2050 800" fill="none" stroke="var(--art-brush)" stroke-width="16" stroke-linecap="round" opacity="0.11"/>
          <ellipse cx="400" cy="380" rx="220" ry="140" fill="var(--art-blob)" opacity="0.25"/>
          <ellipse cx="1550" cy="720" rx="260" ry="160" fill="var(--art-blob)" opacity="0.2"/>
          <ellipse cx="980" cy="540" rx="180" ry="110" fill="var(--art-brush)" opacity="0.09"/>
        </g>
      </svg>
    </div>

    <!-- 4. MÚSICA (Producción musical) -->
    <div class="fondo-tematico" id="fondo-musica">
      <svg viewBox="0 0 1920 1080" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="musicGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="var(--music-top)"/>
            <stop offset="100%" stop-color="var(--music-bottom)"/>
          </linearGradient>
        </defs>
        <rect width="1920" height="1080" fill="url(#musicGrad)"/>
        <g style="animation: waveShift 50s linear infinite;">
          <path d="M0 550 Q 240 450, 480 550 T 960 550 T 1440 550 T 1920 550 T 2400 550 T 2880 550" fill="none" stroke="var(--music-wave1)" stroke-width="4" opacity="0.22"/>
          <path d="M0 620 Q 240 700, 480 620 T 960 620 T 1440 620 T 1920 620 T 2400 620 T 2880 620" fill="none" stroke="var(--music-wave2)" stroke-width="2.5" opacity="0.16"/>
        </g>
        <g transform="translate(680, 880)" fill="var(--music-wave1)" opacity="0.22">
          <rect x="0" y="-120" width="24" height="120" rx="3" style="transform-origin: 12px 0px; animation: eqBar1 12s ease-in-out infinite;"/>
          <rect x="40" y="-160" width="24" height="160" rx="3" style="transform-origin: 52px 0px; animation: eqBar2 9s ease-in-out infinite;"/>
          <rect x="80" y="-90" width="24" height="90" rx="3" style="transform-origin: 92px 0px; animation: eqBar3 14s ease-in-out infinite;"/>
          <rect x="120" y="-200" width="24" height="200" rx="3" style="transform-origin: 132px 0px; animation: eqBar1 11s ease-in-out infinite;"/>
          <rect x="160" y="-140" width="24" height="140" rx="3" style="transform-origin: 172px 0px; animation: eqBar3 8s ease-in-out infinite;"/>
          <rect x="200" y="-180" width="24" height="180" rx="3" style="transform-origin: 212px 0px; animation: eqBar2 13s ease-in-out infinite;"/>
          <rect x="240" y="-110" width="24" height="110" rx="3" style="transform-origin: 252px 0px; animation: eqBar1 10s ease-in-out infinite;"/>
          <rect x="280" y="-70" width="24" height="70" rx="3" style="transform-origin: 292px 0px; animation: eqBar3 15s ease-in-out infinite;"/>
        </g>
      </svg>
    </div>

    <!-- 5. CHARLANDO (Just Chatting / Tertulia / Café) -->
    <div class="fondo-tematico" id="fondo-charlando">
      <svg viewBox="0 0 1920 1080" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="talkGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="var(--chat-top)"/>
            <stop offset="100%" stop-color="var(--chat-bottom)"/>
          </linearGradient>
          <radialGradient id="lampGlow" cx="0.5" cy="0.5" r="0.5">
            <stop offset="0%" stop-color="var(--chat-glow)" stop-opacity="0.25"/>
            <stop offset="70%" stop-color="var(--chat-lamp)" stop-opacity="0.08"/>
            <stop offset="100%" stop-color="var(--chat-bottom)" stop-opacity="0"/>
          </radialGradient>
        </defs>
        <rect width="1920" height="1080" fill="url(#talkGrad)"/>
        <circle cx="280" cy="380" r="320" fill="url(#lampGlow)" style="animation: pulseGlow 14s ease-in-out infinite;"/>
        <g stroke="var(--chat-lamp)" stroke-width="3" fill="none" opacity="0.2">
          <path d="M 220 540 L 280 340 L 340 380 L 260 540"/>
          <path d="M 280 340 L 320 280"/>
          <path d="M 290 270 C 330 250, 370 290, 340 320 Z" fill="var(--chat-glow)" fill-opacity="0.15"/>
        </g>
        <g fill="none" stroke="var(--chat-glow)" stroke-width="4" stroke-linecap="round">
          <path d="M 1600 780 Q 1630 700, 1590 620 T 1620 480" style="animation: riseVapor 35s ease-in-out infinite;"/>
          <path d="M 1640 820 Q 1610 740, 1650 660 T 1630 520" style="animation: riseVapor 42s ease-in-out -15s infinite;"/>
        </g>
      </svg>
    </div>

    <div class="grid-overlay"></div>
    <div class="vignette"></div>
  </div>

  <script>
    const PALETAS = {
      apps: { primario: '#5ecef5', secundario: '#00467b', oscuro: '#030a16' },
      musica: { primario: '#ff1493', secundario: '#e91e63', oscuro: '#260519' },
      arte: { primario: '#f5cba7', secundario: '#3e2723', oscuro: '#1a0f0b' },
      andando: { primario: '#00e676', secundario: '#00c853', oscuro: '#0a3d1c' },
      charlando: { primario: '#e8955e', secundario: '#b46734', oscuro: '#1c1208' },
    };

    let categoriaActual = 'apps';
    let modoActual = 'dark';

    function aplicarPaleta(cat) {
      const p = PALETAS[cat];
      if (!p) return;
      categoriaActual = cat;
      const rootStyle = document.documentElement.style;
      rootStyle.setProperty('--color-primary', p.primario);
      rootStyle.setProperty('--color-secondary', p.secundario);
      rootStyle.setProperty('--color-dark', p.oscuro);

      document.querySelectorAll('.fondo-tematico').forEach(el => {
        el.classList.toggle('activa', el.id === `fondo-${cat}`);
      });
    }

    function aplicarModo(modo) {
      const normalizado = (modo === 'light' || modo === 'claro' || modo === 'dia' || modo === 'día') ? 'light' : 'dark';
      modoActual = normalizado;
      document.documentElement.dataset.theme = normalizado;
      document.documentElement.setAttribute('data-theme', normalizado);
    }

    aplicarPaleta(categoriaActual);
    aplicarModo(modoActual);

    // 1. WebSocket en tiempo real con el VPS
    function conectarWs() {
      const proto = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
      const host = window.location.host || 'directo.apliarte.com';
      const wsUrl = `${proto}//${host}/ws`;

      try {
        const ws = new WebSocket(wsUrl);
        ws.onmessage = (event) => {
          try {
            const data = JSON.parse(event.data);
            if (data && data.categoria && PALETAS[data.categoria]) {
              aplicarPaleta(data.categoria);
            }
            if (data && data.modo) {
              aplicarModo(data.modo);
            }
          } catch (_) {}
        };
        ws.onclose = () => {
          setTimeout(conectarWs, 3000);
        };
      } catch (_) {
        setTimeout(conectarWs, 5000);
      }
    }

    conectarWs();

    // 2. Polling de respaldo cada 2.5s por si el WebSocket se corta
    async function syncCategoria() {
      try {
        const res = await fetch('/api/categoria', { cache: 'no-store' });
        if (res && res.ok) {
          const data = await res.json();
          if (data && data.categoria && data.categoria !== categoriaActual) {
            aplicarPaleta(data.categoria);
          }
          if (data && data.modo && data.modo !== modoActual) {
            aplicarModo(data.modo);
          }
        }
      } catch (_) {}
    }

    setInterval(syncCategoria, 2500);
    syncCategoria();
  </script>
</body>
</html>
