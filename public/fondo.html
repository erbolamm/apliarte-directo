<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ApliArte – Fondo Dinámico Temático</title>
  <style>
    :root {
      --color-primary: #5ecef5;
      --color-secondary: #00467b;
      --color-dark: #0c4a6e;
      --vignette-color: rgba(0, 0, 0, 0.3);
    }

    html[data-theme="light"], :root[data-theme="light"] {
      --vignette-color: rgba(15, 23, 42, 0.18);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      background-color: #0c4a6e;
    }

    body {
      overflow: hidden;
      width: 1920px;
      height: 1080px;
      user-select: none;
    }

    #bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #0c4a6e;
      background-image: linear-gradient(180deg, #1d6fad 0%, #0c4a6e 55%, #083556 100%);
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
      transition: background 1.5s ease-in-out;
    }

    .fondo-tematico {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      overflow: hidden;
      pointer-events: none;
      transition: opacity 1.5s ease-in-out;
      will-change: opacity;
    }

    .fondo-tematico.activa {
      opacity: 1;
    }

    .fondo-tematico > * {
      position: absolute;
    }

    /* Inactive scenes are paused so only one theme costs CPU/GPU. */
    .fondo-tematico:not(.activa) *,
    .fondo-tematico:not(.activa) *::before,
    .fondo-tematico:not(.activa) *::after {
      animation-play-state: paused !important;
    }

    @media (prefers-reduced-motion: reduce) {
      .fondo-tematico *,
      .fondo-tematico *::before,
      .fondo-tematico *::after {
        animation: none !important;
      }
    }

    /* ── Shared pieces ─────────────────────────────────────────────────────
       Every scene is an opaque sky, a horizon at 54vh and a floor in
       perspective. Only transform and opacity are animated, and colours are
       never near-black, so OBS does not key the frame as empty. */
    .cielo {
      inset: 0;
      background: linear-gradient(180deg, var(--sky1) 0%, var(--sky2) 58%, var(--sky3) 100%);
    }

    .resplandor {
      left: 50%;
      top: 54vh;
      width: 130vw;
      height: 64vh;
      margin: -32vh 0 0 -65vw;
      background: radial-gradient(ellipse at center, var(--glow) 0%, transparent 62%);
      opacity: 0.5;
      animation: latir 9s ease-in-out infinite;
    }

    /* Floor in perspective: .malla is the tilted plane, .malla-mov slides one
       cell towards the viewer and loops. */
    .suelo3d {
      left: 0;
      right: 0;
      bottom: 0;
      height: 46vh;
      perspective: 48vh;
      perspective-origin: 50% 0;
      overflow: hidden;
    }
    .suelo3d::after {
      content: '';
      position: absolute;
      left: 0;
      right: 0;
      top: 0;
      height: 34%;
      background: linear-gradient(180deg, var(--sky3), transparent);
    }
    .malla {
      position: absolute;
      left: -50%;
      width: 200%;
      top: 0;
      height: 40vh;
      transform-origin: 50% 0;
      transform: rotateX(70deg);
      background: var(--suelo);
    }
    .malla-mov {
      position: absolute;
      left: 0;
      right: 0;
      top: -8vh;
      bottom: 0;
      background-image:
        repeating-linear-gradient(0deg, var(--linea) 0 0.3vh, transparent 0.3vh 8vh),
        repeating-linear-gradient(90deg, var(--linea) 0 0.3vh, transparent 0.3vh 8vh);
      animation: avanzar 4s linear infinite;
    }

    /* Parallax strip: two identical halves sliding left by one half. */
    .tira {
      left: 0;
      width: 200vw;
      display: flex;
      animation: desfilar 120s linear infinite;
    }
    .tira > i {
      flex: 0 0 50%;
      height: 100%;
      display: block;
    }

    .capa { inset: 0; }
    .capa > * { position: absolute; }

    .flota { animation: flotar 9s ease-in-out infinite; }
    .panel3d { perspective: 110vh; }

    @keyframes avanzar  { from { transform: translateY(0); } to { transform: translateY(8vh); } }
    @keyframes desfilar { from { transform: translateX(0); } to { transform: translateX(-50%); } }
    @keyframes girar    { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes flotar {
      0%, 100% { transform: translate3d(0, 0, 0); }
      50%      { transform: translate3d(0, -2.4vh, 0); }
    }
    @keyframes latir {
      0%, 100% { transform: scale(1); opacity: 0.42; }
      50%      { transform: scale(1.07); opacity: 0.62; }
    }
    @keyframes parpadeo {
      0%, 100% { opacity: 0.25; }
      50%      { opacity: 1; }
    }
    @keyframes vagar {
      0%, 100% { transform: translate(0, 0); }
      25%      { transform: translate(3vw, -4vh); }
      50%      { transform: translate(-2vw, -7vh); }
      75%      { transform: translate(-4vw, -2vh); }
    }
    @keyframes deriva {
      0%, 100% { transform: translate(0, 0) scale(1); }
      33%      { transform: translate(4vw, -3vh) scale(1.12); }
      66%      { transform: translate(-3vw, 4vh) scale(0.92); }
    }
    @keyframes subir {
      0%   { transform: translate(0, 0) scale(0.7); opacity: 0; }
      15%  { opacity: 0.9; }
      85%  { opacity: 0.9; }
      100% { transform: translate(2vw, -78vh) scale(1.1); opacity: 0; }
    }

    /* ── 1. Andando: a walk at dusk ────────────────────────────────────── */
    #fondo-andando {
      --sky1: #0f5a47; --sky2: #2fa56f; --sky3: #f6cf7d; --glow: #ffe9a8;
      --capa1: #3f9a78; --capa2: #23705a; --capa3: #124a3a;
      --hierba: #1c6b45; --asfalto: #3a4750; --borde: #e2e8f0; --linea: #fde68a;
    }
    html[data-theme="light"] #fondo-andando {
      --sky1: #bfe8ff; --sky2: #dff5e1; --sky3: #fff3c4; --glow: #fff8d6;
      --capa1: #a9dbb7; --capa2: #6fbd8c; --capa3: #3c8f66;
      --hierba: #8bd49c; --asfalto: #9aa7b4; --borde: #ffffff; --linea: #ffffff;
    }
    #fondo-andando .astro {
      left: 64vw;
      top: 22vh;
      width: 24vh;
      height: 24vh;
      border-radius: 50%;
      background: radial-gradient(circle, #fffbe6 0%, #ffe08a 52%, rgba(255, 224, 138, 0) 72%);
      animation: latir 8s ease-in-out infinite;
    }
    #fondo-andando .nubes { top: 8vh; height: 16vh; animation-duration: 300s; }
    #fondo-andando .nubes > i {
      background:
        radial-gradient(ellipse 9vw 3vh at 18% 40%, rgba(255, 255, 255, 0.24) 0 98%, transparent 100%),
        radial-gradient(ellipse 6vw 2.2vh at 26% 62%, rgba(255, 255, 255, 0.2) 0 98%, transparent 100%),
        radial-gradient(ellipse 12vw 3.6vh at 62% 68%, rgba(255, 255, 255, 0.2) 0 98%, transparent 100%),
        radial-gradient(ellipse 7vw 2.4vh at 86% 30%, rgba(255, 255, 255, 0.22) 0 98%, transparent 100%);
    }
    #fondo-andando .montes { bottom: 45vh; height: 27vh; animation-duration: 260s; }
    #fondo-andando .montes > i {
      background: var(--capa1);
      clip-path: polygon(0 62%, 7% 38%, 15% 56%, 27% 18%, 38% 52%, 49% 30%, 60% 58%, 72% 12%, 84% 50%, 93% 34%, 100% 62%, 100% 100%, 0 100%);
    }
    #fondo-andando .lomas { bottom: 45vh; height: 15vh; animation-duration: 150s; }
    #fondo-andando .lomas > i {
      background: var(--capa2);
      clip-path: polygon(0 58%, 6% 58%, 6% 30%, 11% 30%, 11% 52%, 19% 52%, 22% 22%, 25% 52%, 34% 52%, 34% 38%, 41% 38%, 41% 60%, 52% 60%, 55% 26%, 58% 60%, 67% 60%, 67% 34%, 73% 34%, 73% 54%, 83% 54%, 86% 20%, 89% 54%, 100% 58%, 100% 100%, 0 100%);
    }
    #fondo-andando .farolas { bottom: 45vh; height: 24vh; animation-duration: 70s; }
    #fondo-andando .farolas > i {
      background:
        radial-gradient(circle at 50% 8%, var(--glow) 0 1vh, rgba(255, 233, 168, 0.35) 1vh 3.2vh, transparent 3.4vh) 0 0 / 25vw 100% repeat-x,
        linear-gradient(90deg, transparent calc(50% - 0.25vh), var(--capa3) calc(50% - 0.25vh) calc(50% + 0.25vh), transparent calc(50% + 0.25vh)) 0 0 / 25vw 100% repeat-x;
    }
    #fondo-andando .setos { bottom: 44vh; height: 7vh; animation-duration: 70s; }
    #fondo-andando .setos > i {
      background: radial-gradient(ellipse at 50% 100%, var(--capa3) 0 68%, transparent 70%) 0 0 / 10vw 100% repeat-x;
    }
    #fondo-andando .malla {
      background: linear-gradient(90deg,
        var(--hierba) 0 43%, var(--borde) 43% 43.5%, var(--asfalto) 43.5% 56.5%,
        var(--borde) 56.5% 57%, var(--hierba) 57% 100%);
    }
    #fondo-andando .malla-mov {
      background-image:
        repeating-linear-gradient(0deg, var(--linea) 0 4vh, transparent 4vh 8vh),
        repeating-linear-gradient(0deg, rgba(255, 255, 255, 0.07) 0 4vh, transparent 4vh 8vh);
      background-size: 0.7% 100%, 100% 100%;
      background-position: 50% 0, 0 0;
      background-repeat: no-repeat, repeat;
      animation-duration: 3s;
    }
    .chispa {
      width: 0.9vh;
      height: 0.9vh;
      border-radius: 50%;
      background: var(--glow);
      box-shadow: 0 0 1.6vh 0.4vh var(--glow);
      animation: vagar 14s ease-in-out infinite, parpadeo 3s ease-in-out infinite;
    }

    /* ── 2. Apps: code floating over a grid ────────────────────────────── */
    #fondo-apps {
      --sky1: #0d3b73; --sky2: #1565a8; --sky3: #39b6e8; --glow: #8fe3ff;
      --suelo: #0e4a80; --linea: rgba(143, 227, 255, 0.6);
      --vidrio: linear-gradient(160deg, rgba(8, 32, 66, 0.86), rgba(13, 59, 115, 0.74));
      --tinta: #8fe3ff;
    }
    html[data-theme="light"] #fondo-apps {
      --sky1: #e0f2fe; --sky2: #bae6fd; --sky3: #7dd3fc; --glow: #ffffff;
      --suelo: #cfe8fb; --linea: rgba(2, 132, 199, 0.45);
      --vidrio: linear-gradient(160deg, rgba(255, 255, 255, 0.92), rgba(224, 242, 254, 0.82));
      --tinta: #0369a1;
    }
    .ventana {
      position: relative;
      width: 100%;
      height: 100%;
      padding: 5.2vh 1.8vh 1.6vh;
      border-radius: 1.4vh;
      border: 0.2vh solid var(--linea);
      background: var(--vidrio);
      box-shadow: 0 0 4vh rgba(94, 206, 245, 0.35);
      transform: rotateY(var(--ry, 0deg)) rotateX(4deg);
    }
    .ventana::before {
      content: '';
      position: absolute;
      left: 1.6vh;
      top: 1.6vh;
      width: 1.3vh;
      height: 1.3vh;
      border-radius: 50%;
      background: #ff6b6b;
      box-shadow: 2.1vh 0 0 #ffd166, 4.2vh 0 0 #6ee7b7;
    }
    .ventana b {
      display: block;
      height: 1.1vh;
      margin-bottom: 1.5vh;
      border-radius: 0.6vh;
      background: var(--tinta);
    }
    .ventana b.k { background: #f472b6; }
    .ventana b.s { background: #6ee7b7; }
    .ventana b.c { opacity: 0.4; }
    .ventana b.cursor {
      width: 1.2vh;
      height: 2vh;
      border-radius: 0.2vh;
      animation: parpadeo 1.1s steps(2, jump-none) infinite;
    }
    .cubo-escena { perspective: 80vh; }
    .cubo {
      position: relative;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      animation: girar3d 36s linear infinite;
    }
    .cubo > i {
      position: absolute;
      inset: 0;
      border: 0.25vh solid var(--glow);
      background: rgba(143, 227, 255, 0.1);
      box-shadow: inset 0 0 3vh rgba(143, 227, 255, 0.3);
    }
    .cubo > i:nth-child(1) { transform: translateZ(var(--mitad)); }
    .cubo > i:nth-child(2) { transform: rotateY(180deg) translateZ(var(--mitad)); }
    .cubo > i:nth-child(3) { transform: rotateY(90deg) translateZ(var(--mitad)); }
    .cubo > i:nth-child(4) { transform: rotateY(-90deg) translateZ(var(--mitad)); }
    .cubo > i:nth-child(5) { transform: rotateX(90deg) translateZ(var(--mitad)); }
    .cubo > i:nth-child(6) { transform: rotateX(-90deg) translateZ(var(--mitad)); }
    @keyframes girar3d {
      from { transform: rotateX(-22deg) rotateY(0deg); }
      to   { transform: rotateX(-22deg) rotateY(360deg); }
    }
    .bit {
      width: 0.8vh;
      height: 0.8vh;
      background: var(--glow);
      opacity: 0;
      animation: subir 13s linear infinite;
    }

    /* ── 3. Arte: a studio with floating canvases ──────────────────────── */
    #fondo-arte {
      --sky1: #6b3a2a; --sky2: #8a4d38; --sky3: #5a3024; --glow: #f5cba7;
      --suelo: #4a281d; --marco: #f5e6d0;
    }
    html[data-theme="light"] #fondo-arte {
      --sky1: #fdfbf7; --sky2: #f5ede0; --sky3: #e7d3bd; --glow: #ffffff;
      --suelo: #d9bfa4; --marco: #8d6e63;
    }
    #fondo-arte .malla {
      background: repeating-linear-gradient(90deg,
        rgba(0, 0, 0, 0.16) 0 0.2vw, transparent 0.2vw 6vw,
        rgba(255, 255, 255, 0.05) 6vw 6.2vw, transparent 6.2vw 12vw), var(--suelo);
    }
    .mancha {
      border-radius: 50%;
      background: radial-gradient(circle, var(--c) 0%, transparent 68%);
      opacity: 0.5;
      animation: deriva 26s ease-in-out infinite;
    }
    .trazo {
      left: 0;
      width: 100vw;
      height: 28vh;
      overflow: visible;
    }
    .trazo path {
      fill: none;
      stroke: currentColor;
      stroke-width: 26;
      stroke-linecap: round;
      stroke-dasharray: 100;
      stroke-dashoffset: 100;
      opacity: 0.6;
      animation: pintar 16s ease-in-out infinite;
    }
    @keyframes pintar {
      0%   { stroke-dashoffset: 100; }
      45%  { stroke-dashoffset: 0; }
      60%  { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -100; }
    }
    .cuadro {
      width: 100%;
      height: 100%;
      border: 1.2vh solid var(--marco);
      border-radius: 0.4vh;
      box-shadow: 0 3vh 5vh rgba(0, 0, 0, 0.35);
      animation: mecer 16s ease-in-out infinite;
    }
    @keyframes mecer {
      0%, 100% { transform: rotateY(-18deg) rotateX(3deg); }
      50%      { transform: rotateY(18deg) rotateX(-2deg); }
    }
    .cuadro.a1 {
      background:
        radial-gradient(circle at 30% 35%, #ffd166 0 18%, transparent 19%),
        radial-gradient(circle at 70% 65%, #ef476f 0 24%, transparent 25%),
        linear-gradient(135deg, #06d6a0, #118ab2);
    }
    .cuadro.a2 { background: conic-gradient(from 40deg, #ffd166, #ef476f, #9b5de5, #00bbf9, #06d6a0, #ffd166); }
    .cuadro.a3 { background: repeating-linear-gradient(60deg, #f15bb5 0 3vh, #fee440 3vh 6vh, #00bbf9 6vh 9vh); }
    .cuadro.a4 {
      background:
        radial-gradient(circle at 50% 46%, #fff3b0 0 12%, transparent 13%),
        linear-gradient(180deg, #9b5de5, #f15bb5 46%, #f8961e 46%, #fee440);
    }
    .gota {
      width: 1.5vh;
      height: 1.9vh;
      border-radius: 50% 50% 50% 50% / 62% 62% 38% 38%;
      background: var(--c);
      opacity: 0;
      animation: caer 9s ease-in infinite;
    }
    @keyframes caer {
      0%   { transform: translateY(-6vh); opacity: 0; }
      10%  { opacity: 0.85; }
      90%  { opacity: 0.85; }
      100% { transform: translateY(112vh); opacity: 0; }
    }

    /* ── 4. Música: sunset, grid and equaliser ─────────────────────────── */
    #fondo-musica {
      --sky1: #4c1d95; --sky2: #be185d; --sky3: #fb7185; --glow: #fde68a;
      --suelo: #3b0f5c; --linea: rgba(249, 168, 212, 0.75);
    }
    html[data-theme="light"] #fondo-musica {
      --sky1: #fce7f3; --sky2: #fbcfe8; --sky3: #f9a8d4; --glow: #ffffff;
      --suelo: #fdf2f8; --linea: rgba(190, 24, 93, 0.4);
    }
    #fondo-musica .sol {
      left: 50%;
      top: 24vh;
      width: 44vh;
      height: 44vh;
      margin-left: -22vh;
      border-radius: 50%;
      background: linear-gradient(180deg, #fde68a 0%, #fb7185 55%, #c026d3 100%);
      -webkit-mask-image: linear-gradient(180deg, #000 0 46%, transparent 46% 48%, #000 48% 54%, transparent 54% 57%, #000 57% 62%, transparent 62% 66%, #000 66% 100%);
      mask-image: linear-gradient(180deg, #000 0 46%, transparent 46% 48%, #000 48% 54%, transparent 54% 57%, #000 57% 62%, transparent 62% 66%, #000 66% 100%);
    }
    .eq {
      left: 4vw;
      right: 4vw;
      bottom: 46vh;
      height: 17vh;
      display: flex;
      align-items: flex-end;
      gap: 0.6vw;
      opacity: 0.88;
    }
    .eq > span {
      flex: 1;
      height: 100%;
      border-radius: 0.6vh 0.6vh 0 0;
      background: linear-gradient(180deg, #fde68a, #fb7185 50%, #c026d3);
      transform-origin: 50% 100%;
      animation: eq1 1.2s ease-in-out infinite alternate;
    }
    .eq > span:nth-child(3n)   { animation-name: eq2; animation-duration: 0.9s; }
    .eq > span:nth-child(4n+1) { animation-name: eq3; animation-duration: 1.5s; }
    .eq > span:nth-child(5n)   { animation-duration: 0.7s; }
    .eq > span:nth-child(2n)   { animation-delay: -0.4s; }
    .eq > span:nth-child(7n)   { animation-delay: -0.9s; }
    @keyframes eq1 { from { transform: scaleY(0.25); } to { transform: scaleY(0.95); } }
    @keyframes eq2 { from { transform: scaleY(0.65); } to { transform: scaleY(0.15); } }
    @keyframes eq3 { from { transform: scaleY(0.1); }  to { transform: scaleY(0.75); } }
    .plato { perspective: 90vh; }
    .plato > div {
      width: 100%;
      height: 100%;
      transform: rotateX(58deg) rotateZ(var(--rz, 0deg));
    }
    .vinilo {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background:
        radial-gradient(circle, #fde68a 0 7%, #fb7185 7% 17%, transparent 17.5%),
        conic-gradient(from 0deg, rgba(255, 255, 255, 0.3), transparent 12%, transparent 50%, rgba(255, 255, 255, 0.22) 56%, transparent 68%),
        repeating-radial-gradient(circle, #2a1038 0 0.5vh, #46205a 0.5vh 0.7vh);
      box-shadow: 0 0 5vh rgba(251, 113, 133, 0.55);
      animation: girar 6s linear infinite;
    }
    .nota {
      font: 700 5.5vh/1 system-ui, sans-serif;
      color: var(--glow);
      text-shadow: 0 0 2vh rgba(253, 230, 138, 0.7);
      opacity: 0;
      animation: subir 15s linear infinite;
    }
    html[data-theme="light"] .nota { color: #be185d; text-shadow: none; }

    /* ── 5. Charlando: a warm café ─────────────────────────────────────── */
    #fondo-charlando {
      --sky1: #7c2d12; --sky2: #b45309; --sky3: #6b3416; --glow: #fed7aa;
      --suelo: #7c3f1d; --papel: rgba(255, 247, 237, 0.92); --punto: #b45309;
    }
    html[data-theme="light"] #fondo-charlando {
      --sky1: #fff7ed; --sky2: #ffedd5; --sky3: #fed7aa; --glow: #ffffff;
      --suelo: #e9b98a; --papel: rgba(255, 255, 255, 0.95); --punto: #c2410c;
    }
    #fondo-charlando .malla {
      background: repeating-linear-gradient(90deg,
        rgba(0, 0, 0, 0.2) 0 0.2vw, transparent 0.2vw 6vw,
        rgba(255, 255, 255, 0.06) 6vw 6.2vw, transparent 6.2vw 12vw), var(--suelo);
    }
    .bokeh > i {
      border-radius: 50%;
      background: radial-gradient(circle, rgba(254, 215, 170, 0.55) 0%, rgba(253, 186, 116, 0.22) 55%, transparent 70%);
      animation: deriva 22s ease-in-out infinite, parpadeo 7s ease-in-out infinite;
    }
    .lampara {
      top: 0;
      width: 14vh;
      height: 30vh;
      transform-origin: 50% 0;
      animation: balanceo 7s ease-in-out infinite alternate;
    }
    .lampara > * { position: absolute; }
    .lampara .cable {
      left: 50%;
      top: 0;
      width: 0.3vh;
      height: 20vh;
      margin-left: -0.15vh;
      background: #4a2412;
    }
    .lampara .pantalla {
      left: 0;
      top: 20vh;
      width: 100%;
      height: 8vh;
      background: linear-gradient(180deg, #fdba74, #ea580c);
      clip-path: polygon(30% 0, 70% 0, 100% 100%, 0 100%);
    }
    .lampara .haz {
      left: -90%;
      top: 28vh;
      width: 280%;
      height: 46vh;
      background: linear-gradient(180deg, rgba(254, 215, 170, 0.5), rgba(254, 215, 170, 0));
      clip-path: polygon(36% 0, 64% 0, 100% 100%, 0 100%);
      animation: parpadeo 6s ease-in-out infinite;
    }
    @keyframes balanceo {
      from { transform: rotate(-5deg); }
      to   { transform: rotate(5deg); }
    }
    .bocadillo {
      top: 82vh;
      width: 17vh;
      height: 10vh;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1.2vh;
      border-radius: 3vh;
      background: var(--papel);
      opacity: 0;

  <div id="avatar-layer" aria-hidden="true" style="position:fixed;inset:0;z-index:10;pointer-events:none;overflow:hidden;"></div>
  <script id="avatar-overlay">
    // Independent 2D visitors: never mutate office assignments or ownership.
    const avatarOverlay = {
      avatars: new Map(),
      congaEndsAt: 0,
      lastFrame: null,
      bounds() {
        return { x: Math.max(0, window.innerWidth - 48), y: Math.max(0, window.innerHeight - 48) };
      },
      destination() {
        const bounds = this.bounds();
        return { x: Math.random() * bounds.x, y: Math.random() * bounds.y };
      },
      command(cmd, now = performance.now()) {
        if (!cmd || !['libre', 'conga', 'reset'].includes(cmd.comando)) return;
        const login = String(cmd.usuario || '').trim().toLowerCase();
        if (!login) return;
        if (cmd.comando === 'reset') {
          const avatar = this.avatars.get(login);
          if (avatar) { avatar.node.remove(); this.avatars.delete(login); }
          return;
        }
        if (cmd.comando === 'conga' && now >= this.congaEndsAt) {
          if (login !== 'apliarte') return;
          this.congaEndsAt = now + 60000;
        }
        let avatar = this.avatars.get(login);
        if (!avatar) {
          if (this.avatars.size >= 64) return;
          const node = document.createElement('div');
          node.textContent = '🚶 ' + login.slice(0, 25);
          node.style.cssText = 'position:absolute;left:0;top:0;width:48px;height:48px;font:12px sans-serif;color:white;text-shadow:0 1px 3px black;overflow:hidden;';
          document.getElementById('avatar-layer').appendChild(node);
          const bounds = this.bounds();
          avatar = { node, x: bounds.x / 2, y: bounds.y / 2, target: this.destination(), mode: 'free' };
          this.avatars.set(login, avatar);
        }
        avatar.mode = cmd.comando === 'conga' ? 'conga' : 'free';
      },
      tick(now) {
        const dt = this.lastFrame === null ? 0 : Math.min(0.1, Math.max(0, (now - this.lastFrame) / 1000));
        this.lastFrame = now;
        if (this.congaEndsAt && now >= this.congaEndsAt) {
          this.congaEndsAt = 0;
          for (const avatar of this.avatars.values()) avatar.mode = 'free';
        }
        const bounds = this.bounds();
        let dancer = 0;
        for (const avatar of this.avatars.values()) {
          if (avatar.mode === 'conga') {
            const angle = now / 4000 - dancer++ * 0.22;
            avatar.x = bounds.x * (0.5 + 0.45 * Math.cos(angle));
            avatar.y = bounds.y * (0.5 + 0.45 * Math.sin(angle));
          } else {
            avatar.target.x = Math.min(bounds.x, avatar.target.x);
            avatar.target.y = Math.min(bounds.y, avatar.target.y);
            const dx = avatar.target.x - avatar.x;
            const dy = avatar.target.y - avatar.y;
            const distance = Math.hypot(dx, dy);
            const step = Math.min(distance, 100 * dt);
            if (distance > 1) {
              avatar.x += dx / distance * step;
              avatar.y += dy / distance * step;
            } else avatar.target = this.destination();
          }
          avatar.x = Math.max(0, Math.min(bounds.x, avatar.x));
          avatar.y = Math.max(0, Math.min(bounds.y, avatar.y));
          avatar.node.style.transform = `translate(${avatar.x}px, ${avatar.y}px)`;
        }
      },
    };
    function animateAvatars(now) {
      avatarOverlay.tick(now);
      requestAnimationFrame(animateAvatars);
    }
    requestAnimationFrame(animateAvatars);
  </script>

  <script>
    const PALETAS = {
      apps: { primario: '#5ecef5', secundario: '#00467b', oscuro: '#0c4a6e' },
      musica: { primario: '#ff1493', secundario: '#e91e63', oscuro: '#9d174d' },
      arte: { primario: '#f5cba7', secundario: '#3e2723', oscuro: '#6b3a2a' },
      andando: { primario: '#00e676', secundario: '#00c853', oscuro: '#15803d' },
      charlando: { primario: '#e8955e', secundario: '#b46734', oscuro: '#9a3412' },
      damas: { primario: '#5ecef5', secundario: '#00467b', oscuro: '#081d33' },
    };

    // Opaque frame for each theme. Painted even when the WebSocket never connects.
    const BASES = {
      dark: {
        apps: 'linear-gradient(180deg, #1d6fad 0%, #0c4a6e 55%, #083556 100%)',
        musica: 'linear-gradient(180deg, #be185d 0%, #4a044e 100%)',
        arte: 'linear-gradient(180deg, #a1624a 0%, #3e241c 100%)',
        andando: 'linear-gradient(180deg, #22c55e 0%, #052e16 100%)',
        charlando: 'linear-gradient(180deg, #ea580c 0%, #431407 100%)',
        damas: 'radial-gradient(circle at 50% 40%, #0e3b5e 0%, #071f33 100%)',
      },
      light: {
        apps: 'linear-gradient(180deg, #e0f2fe 0%, #bae6fd 100%)',
        musica: 'linear-gradient(180deg, #fce7f3 0%, #fbcfe8 100%)',
        arte: 'linear-gradient(180deg, #fff7ed 0%, #fed7aa 100%)',
        andando: 'linear-gradient(180deg, #dcfce7 0%, #86efac 100%)',
        charlando: 'linear-gradient(180deg, #ffedd5 0%, #fdba74 100%)',
        damas: 'radial-gradient(circle at 50% 40%, #e0f2fe 0%, #bae6fd 100%)',
      },
    };

    const urlParams = new URLSearchParams(window.location.search);
    let categoriaActual = (urlParams.get('damas') === '1' || urlParams.get('tablero') === 'damas' || urlParams.get('vista') === 'damas') ? 'damas' : 'apps';
    let modoActual = 'dark';

    function pintarBase(cat) {
      const grupo = BASES[modoActual] || BASES.dark;
      const imagen = grupo[cat] || grupo.apps;
      const bg = document.getElementById('bg');
      if (!bg || !imagen) return;
      bg.style.backgroundColor = PALETAS[cat] ? PALETAS[cat].oscuro : '#0c4a6e';
      bg.style.backgroundImage = imagen;
      document.documentElement.style.backgroundColor = bg.style.backgroundColor;
    }

    function aplicarPaleta(cat) {
      const p = PALETAS[cat];
      if (!p) return;
      categoriaActual = cat;
      const rootStyle = document.documentElement.style;
      rootStyle.setProperty('--color-primary', p.primario);
      rootStyle.setProperty('--color-secondary', p.secundario);
      rootStyle.setProperty('--color-dark', p.oscuro);
      pintarBase(cat);

      document.querySelectorAll('.fondo-tematico').forEach(el => {
        el.classList.toggle('activa', el.id === `fondo-${cat}`);
      });
    }

    function aplicarModo(modo) {
      const normalizado = (modo === 'light' || modo === 'claro' || modo === 'dia' || modo === 'día') ? 'light' : 'dark';
      modoActual = normalizado;
      document.documentElement.dataset.theme = normalizado;
      document.documentElement.setAttribute('data-theme', normalizado);
      pintarBase(categoriaActual);
    }

    aplicarPaleta(categoriaActual);
    aplicarModo(modoActual);

    // 1. WebSocket en tiempo real con el VPS
    function conectarWs() {
      const proto = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
      const host = window.location.host || 'directo.apliarte.com';
      const wsUrl = `${proto}//${host}/ws`;

      try {
        const ws = new WebSocket(wsUrl);
        ws.onmessage = (event) => {
          try {
            const data = JSON.parse(event.data);
            // Consume only the canonical envelope; comando_chat is a duplicate.
            if (data && data.type === 'directo_comando') avatarOverlay.command(data.cmd);
            const cat = (data && (data.categoria || (data.tablero === 'damas' ? 'damas' : null)));
            if (cat && PALETAS[cat]) {
              aplicarPaleta(cat);
            }
            if (data && data.modo) {
              aplicarModo(data.modo);
            }
          } catch (_) {}
        };
        ws.onclose = () => {
          setTimeout(conectarWs, 3000);
        };
      } catch (_) {
        setTimeout(conectarWs, 5000);
      }
    }

    conectarWs();

    // 2. Polling de respaldo cada 2.5s por si el WebSocket se corta
    async function syncCategoria() {
      try {
        const res = await fetch('/api/categoria', { cache: 'no-store' });
        if (res && res.ok) {
          const data = await res.json();
          const cat = data && (data.categoria || (data.tablero === 'damas' ? 'damas' : null));
          if (cat && cat !== categoriaActual && PALETAS[cat]) {
            aplicarPaleta(cat);
          }
          if (data && data.modo && data.modo !== modoActual) {
            aplicarModo(data.modo);
          }
        }
      } catch (_) {}
    }

    setInterval(syncCategoria, 2500);
    syncCategoria();
  </script>
</body>
</html>
