<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>ApliArte Directo — Pizarra Plus privada</title>
  <style>
    /* Canonical central APLIARTE_BRAND_KIT; canvas remains transparent. */
    :root {--panel-bg:#fdfdfd;--text-main:#303030;--text-muted:#6b6b6b;--accent:#005fa9;--border-color:#d9d9d9;--danger:#c62828;--bar-h:56px;}
    html[data-theme="dark"] {--panel-bg:#00467b;--text-main:#fdfdfd;--text-muted:#d9d9d9;--accent:#5ecef5;--border-color:#a6a6a6;--danger:#ff8a80;}

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent !important;
      color: var(--text-main);
      font-family: Inter, "DejaVu Sans", system-ui, sans-serif;
    }

    /* The whole page lives inside the iPad safe area: nothing under the clock,
       battery, Wi-Fi or the multitasking dots. */
    #app-container {
      position: fixed;
      inset: 0;
      display: flex;
      padding: calc(env(safe-area-inset-top) + 8px) calc(env(safe-area-inset-right) + 8px) calc(env(safe-area-inset-bottom) + 8px) calc(env(safe-area-inset-left) + 8px);
      background: transparent !important;
    }

    /* Stage group: the 16:9 drawing area with the toolbar glued under it. */
    #canvas-wrapper {
      flex: 1;
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: transparent !important;
    }

    #canvas-container {
      position: relative;
      flex-shrink: 0;
      border: 1px dashed var(--border-color);
      border-radius: 8px;
      overflow: hidden;
      background: transparent !important;
    }

    #obs-preview-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      pointer-events: none;
      display: none;
      opacity: 0.85;
      z-index: 1;
    }

    #drawing-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      cursor: crosshair;
      touch-action: none;
      background: transparent !important;
      z-index: 2;
    }

    #preview-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      touch-action: none;
      background: transparent !important;
      z-index: 3;
    }

    #toolbar {
      flex-shrink: 0;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 6px;
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
    }

    .bar-sep {
      width: 1px;
      height: 28px;
      background: var(--border-color);
    }

    .bar-icon {
      width: 40px;
      height: 40px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--text-main);
      background: transparent;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      cursor: pointer;
      touch-action: manipulation;
      flex-shrink: 0;
    }
    .bar-icon svg {width: 20px; height: 20px;}
    .bar-icon[aria-pressed="true"], .bar-icon.active {color: var(--accent); border-color: var(--accent); background: rgba(0,95,169,.1);}
    .bar-icon:disabled {opacity: .4; cursor: not-allowed;}
    .bar-icon:focus-visible, .sheet-btn:focus-visible, .cmd-btn:focus-visible {outline: 2px solid var(--accent); outline-offset: 2px;}
    .bar-icon.danger {color: var(--danger);}
    @media (pointer: coarse) { .bar-icon {width: 44px; height: 44px;} }
    html[data-precision="pen"] .bar-icon {width: 36px; height: 36px;}

    #status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--danger);
      flex-shrink: 0;
    }
    #status-dot.online {background: #2e7d32;}
    .status-label {font-size: 12px; color: var(--danger); font-weight: 700;}
    .status-label[hidden] {display: none;}
    #btn-draw-menu {position: relative; --current-color: #005fa9;}
    #btn-draw-menu::after {content: ''; position: absolute; left: 8px; right: 8px; bottom: 4px; height: 3px; border-radius: 2px; background: var(--current-color);}
    .bar-icon.danger[aria-pressed="true"] {background: var(--danger); border-color: var(--danger); color: #fdfdfd;}
    .sr-only {position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap;}

    /* Drawing panel: opens just above the toolbar. */
    .popover {
      position: fixed;
      left: calc(env(safe-area-inset-left) + 8px);
      right: calc(env(safe-area-inset-right) + 8px);
      bottom: calc(env(safe-area-inset-bottom) + var(--bar-h) + 24px);
      margin: 0 auto;
      max-width: 560px;
      max-height: 60vh;
      overflow: auto;
      z-index: 30;
      display: grid;
      gap: 12px;
      padding: 12px;
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      touch-action: auto;
    }
    .popover[hidden], .sheet[hidden] {display: none;}
    .panel-row {display: flex; flex-wrap: wrap; align-items: center; gap: 8px;}
    .panel-row[hidden] {display: none;}
    .panel-title {font-size: 12px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: .5px;}
    .color-swatch {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 2px solid var(--border-color);
      cursor: pointer;
      touch-action: manipulation;
    }
    .color-swatch.active {border-color: var(--accent); outline: 2px solid var(--accent); outline-offset: 1px;}
    #custom-color {width: 44px; height: 44px; padding: 2px; border: 1px solid var(--border-color); border-radius: 6px; background: transparent;}
    #size-range {flex: 1; min-width: 140px; accent-color: var(--accent);}
    #size-value {min-width: 3ch; font-variant-numeric: tabular-nums;}
    .touch-toggle {display: flex; align-items: center; gap: 8px; font-size: 14px;}
    .text-entry {position: fixed; z-index: 35; display: flex; align-items: center; gap: 6px; padding: 6px; background: var(--panel-bg); border: 1px solid var(--accent); border-radius: 8px;}
    .text-entry[hidden] {display: none;}
    #text-entry-input {min-width: 200px; min-height: 40px; padding: 0 10px; font-size: 16px; color: var(--text-main); background: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 6px;}

    /* Full-screen sheets inside the safe area: Chat, Commands, OBS, Settings. */
    .sheet {
      position: fixed;
      top: calc(env(safe-area-inset-top) + 8px);
      right: calc(env(safe-area-inset-right) + 8px);
      bottom: calc(env(safe-area-inset-bottom) + 8px);
      left: calc(env(safe-area-inset-left) + 8px);
      z-index: 40;
      display: flex;
      flex-direction: column;
      background: var(--panel-bg);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      overflow: hidden;
      touch-action: auto;
    }
    .sheet-head {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px;
      border-bottom: 1px solid var(--border-color);
    }
    .sheet-head h2 {flex: 1; font-size: 16px;}
    .sheet-body {flex: 1; min-height: 0; overflow: auto; padding: 12px; display: grid; gap: 12px; align-content: start;}
    .sheet-body.flush {padding: 0; display: block;}
    .sheet iframe {width: 100%; height: 100%; border: 0; display: block;}
    .sheet label {display: grid; gap: 6px; font-size: 14px;}
    .sheet select, .sheet input[type="search"], .sheet input[type="text"] {
      min-height: 44px; width: 100%; padding: 0 10px;
      background: var(--panel-bg); color: var(--text-main);
      border: 1px solid var(--border-color); border-radius: 6px; font-size: 15px;
    }
    .sheet-btn {
      min-height: 44px; padding: 0 14px;
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      background: transparent; color: var(--text-main);
      border: 1px solid var(--border-color); border-radius: 6px;
      font-size: 15px; font-weight: 600; cursor: pointer; white-space: normal; text-align: center;
    }
    .sheet-btn.primary {background: var(--accent); border-color: var(--accent); color: #fdfdfd;}
    .sheet-btn[aria-pressed="true"] {color: var(--accent); border-color: var(--accent);}
    #obs-message, #commands-message {font-size: 14px; white-space: normal;}
    #commands-message[data-kind="error"] {color: var(--danger); font-weight: 700;}

    .cmd-grid {display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 8px;}
    .cmd-btn {
      min-height: 56px; padding: 8px; text-align: left;
      display: grid; gap: 2px; align-content: center;
      background: transparent; color: var(--text-main);
      border: 1px solid var(--border-color); border-radius: 6px; cursor: pointer;
    }
    .cmd-btn strong {font-size: 15px; font-family: ui-monospace, SFMono-Regular, monospace; overflow-wrap: anywhere;}
    .cmd-btn small {font-size: 12px; color: var(--text-muted);}
    .cmd-step {display: grid; gap: 10px; padding: 12px; border: 1px solid var(--accent); border-radius: 8px;}
    .cmd-step[hidden] {display: none;}
    .chip-list {display: flex; flex-wrap: wrap; gap: 8px;}
    .chip {min-height: 40px; padding: 0 12px; border: 1px solid var(--border-color); border-radius: 20px; background: transparent; color: var(--text-main); font-size: 14px; cursor: pointer;}

    /* Escenas y Fuentes táctiles OBS */
    .scene-grid {display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 8px;}
    .scene-btn {
      min-height: 56px; padding: 10px 12px; text-align: left;
      display: grid; gap: 3px; align-content: center;
      background: transparent; color: var(--text-main);
      border: 1px solid var(--border-color); border-radius: 6px; cursor: pointer;
      touch-action: manipulation;
    }
    .scene-btn strong {font-size: 15px; font-weight: 700; overflow-wrap: anywhere;}
    .scene-btn small {font-size: 11px; color: var(--text-muted);}
    .scene-btn.active {
      background: rgba(0, 95, 169, 0.12);
      border-color: var(--accent);
      color: var(--accent);
    }
    .scene-btn.active small {
      color: var(--accent);
      font-weight: 600;
    }

    .sources-grid {display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px;}
    .source-card {
      min-height: 56px; padding: 8px 12px;
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      background: transparent; color: var(--text-main);
      border: 1px solid var(--border-color); border-radius: 6px;
    }
    .source-card.hidden-source {
      opacity: 0.6;
      border-style: dashed;
    }
    .source-info {display: grid; gap: 2px; min-width: 0; flex: 1;}
    .source-info strong {font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;}
    .source-info small {font-size: 11px; color: var(--text-muted);}
    .eye-btn {
      width: 44px; height: 44px; min-width: 44px;
      display: inline-flex; align-items: center; justify-content: center;
      background: transparent; color: var(--text-main);
      border: 1px solid var(--border-color); border-radius: 6px;
      cursor: pointer; touch-action: manipulation; flex-shrink: 0;
    }
    .eye-btn.visible {
      color: var(--accent); border-color: var(--accent);
      background: rgba(0, 95, 169, 0.12);
    }
    .eye-btn.hidden-source {
      color: var(--text-muted);
    }
    .eye-btn svg {width: 22px; height: 22px;}

    /* One Admin engine: hidden, compact camera preview, or complete in Settings. */
    #admin-dock {position: fixed; z-index: 22; background: #303030; border: 1px solid var(--border-color); border-radius: 8px; overflow: hidden;}
    #admin-dock[hidden] {display: none;}
    #admin-dock iframe {width: 100%; height: 100%; border: 0; display: block;}
    #admin-dock .dock-head {display: none;}
    #admin-dock.settings {
      top: calc(env(safe-area-inset-top) + 8px);
      right: calc(env(safe-area-inset-right) + 8px);
      bottom: calc(env(safe-area-inset-bottom) + 8px);
      left: calc(env(safe-area-inset-left) + 8px);
      z-index: 40;
      display: flex;
      flex-direction: column;
      background: var(--panel-bg);
    }
    #admin-dock.settings .dock-head {display: flex; align-items: center; gap: 8px; padding: 8px; border-bottom: 1px solid var(--border-color); color: var(--text-main);}
    #admin-dock.settings .dock-head h2 {flex: 1; font-size: 16px;}
    #admin-dock.settings iframe {flex: 1; height: auto;}
    #admin-dock.camera-dock {
      right: calc(env(safe-area-inset-right) + 8px);
      bottom: calc(env(safe-area-inset-bottom) + var(--bar-h) + 24px);
      width: min(320px, 45vw);
      height: 220px;
    }
    #btn-camera-preview-close {position: absolute; right: 6px; top: 6px; z-index: 2; background: var(--panel-bg);}
    #admin-dock.settings #btn-camera-preview-close {display: none;}
  </style>
</head>
<body>
  <div id="app-container">
    <main id="canvas-wrapper">
      <div id="canvas-container">
        <img id="obs-preview-bg" alt="Vista previa OBS" />
        <canvas id="drawing-canvas"></canvas>
        <canvas id="preview-canvas"></canvas>
      </div>
      <nav id="toolbar" aria-label="Controles de la pizarra">
        <button type="button" class="bar-icon" id="btn-draw-menu" aria-label="Dibujo: herramientas, colores y grosor" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20l4-1L20 7l-3-3L5 16zM14 7l3 3"/></svg></button>
        <span class="bar-sep" aria-hidden="true"></span>
        <button type="button" class="bar-icon" id="btn-undo" aria-label="Deshacer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"/></svg></button>
        <button type="button" class="bar-icon" id="btn-redo" aria-label="Rehacer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 7v6h-6"/><path d="M3 17a9 9 0 0 1 9-9 9 9 0 0 1 6 2.3L21 13"/></svg></button>
        <button type="button" class="bar-icon danger" id="btn-clear" aria-label="Limpiar todo el dibujo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></button>
        <span class="bar-sep" aria-hidden="true"></span>
        <button type="button" class="bar-icon" id="btn-obs-snapshot" aria-label="Capturar imagen fija de OBS"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7h4l2-3h6l2 3h4v13H3z"/><circle cx="12" cy="13" r="4"/></svg></button>
        <button type="button" class="bar-icon" id="btn-device-camera" aria-label="Cámara de este dispositivo: cargando" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="12" height="14" rx="2"/><path d="M15 10l6-4v12l-6-4"/></svg></button>
        <button type="button" class="bar-icon" id="btn-tablet-mic" aria-label="Micrófono de este dispositivo: cargando" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10v2a7 7 0 0 0 14 0v-2M12 19v3M8 22h8"/></svg></button>
        <button type="button" class="bar-icon" id="btn-tts" aria-label="Voz del chat (TTS): cargando" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9zM16 9a4 4 0 0 1 0 6M19 6a8 8 0 0 1 0 12"/></svg></button>
        <span class="bar-sep" aria-hidden="true"></span>
        <button type="button" class="bar-icon" id="btn-chat-view" aria-label="Chat" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4h18v13H8l-5 4zM7 8h10M7 12h7"/></svg></button>
        <button type="button" class="bar-icon" id="btn-commands-view" aria-label="Comandos" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6l6 6-6 6M13 18h7"/></svg></button>
        <button type="button" class="bar-icon" id="btn-obs-menu" aria-label="Controles OBS" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg></button>
        <button type="button" class="bar-icon" id="btn-settings" aria-label="Ajustes: panel completo" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
        <span id="status-dot" title="Estado de la conexión" aria-hidden="true"></span>
        <span id="status-text" class="status-label" role="status">Conectando</span>
      </nav>
    </main>
  </div>

  <section id="draw-panel" class="popover" aria-label="Dibujo" hidden>
    <div class="panel-title">Herramienta</div>
    <div class="panel-row" id="tools-group">
      <button type="button" id="tool-pen" class="bar-icon active" data-tool="pen" aria-label="Trazo libre"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/><path d="M2 2l7.586 7.586"/></svg></button>
      <button type="button" id="tool-highlighter" class="bar-icon" data-tool="highlighter" aria-label="Marcador translúcido"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 11-6 6v3h3l6-6"/><path d="m22 12-4.6 4.6a2 2 0 0 1-2.8 0l-5.2-5.2a2 2 0 0 1 0-2.8L14 4"/></svg></button>
      <button type="button" id="tool-line" class="bar-icon" data-tool="line" aria-label="Línea recta"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="5" y1="19" x2="19" y2="5"/></svg></button>
      <button type="button" id="tool-arrow" class="bar-icon" data-tool="arrow" aria-label="Flecha"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg></button>
      <button type="button" id="tool-arrow2" class="bar-icon" data-tool="arrow2" aria-label="Flecha doble"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="15 8 19 12 15 16"/><polyline points="9 8 5 12 9 16"/></svg></button>
      <button type="button" id="tool-rect" class="bar-icon" data-tool="rect" aria-label="Rectángulo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/></svg></button>
      <button type="button" id="tool-ellipse" class="bar-icon" data-tool="ellipse" aria-label="Elipse o círculo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/></svg></button>
      <button type="button" id="tool-text" class="bar-icon" data-tool="text" aria-label="Texto"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 6V4h14v2M12 4v16M9 20h6"/></svg></button>

    <div class="dock-head">
      <h2>Ajustes: panel completo</h2>
      <a class="bar-icon" href="/pizarra-plus/guia" target="_blank" rel="noopener" aria-label="Abrir guía"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M4 4h7v16H4zM13 4h7v16h-7z"/></svg></a>
      <button type="button" class="bar-icon" id="theme-toggle" aria-label="Cambiar tema claro u oscuro"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 4v16"/></svg></button>

  <script src="/js/pizarra-render.js?v=1"></script>
  <script src="/api/pizarra-plus/pointer-owner.js"></script>
  <script>
    const wrapper = document.getElementById('canvas-wrapper');
    const container = document.getElementById('canvas-container');
    const toolbar = document.getElementById('toolbar');
    const canvas = document.getElementById('drawing-canvas');
    const ctx = canvas.getContext('2d', { alpha: true });
    const previewCanvas = document.getElementById('preview-canvas');
    const previewCtx = previewCanvas.getContext('2d', { alpha: true });

    const obsPreviewBg = document.getElementById('obs-preview-bg');
    const statusDot = document.getElementById('status-dot');
    const statusText = document.getElementById('status-text');

    const pointerOwner = createPointerOwner();
    const allowTouch = document.getElementById('allow-touch');
    const btnObsPreview = document.getElementById('btn-obs-preview');
    const btnObsMute = document.getElementById('btn-obs-mute');
    const sceneSelect = document.getElementById('obs-scene');
    const inputSelect = document.getElementById('obs-input');
    const obsMessage = document.getElementById('obs-message');
    const intervalSelect = document.getElementById('obs-interval');
    const drawPanel = document.getElementById('draw-panel');
    const drawButton = document.getElementById('btn-draw-menu');
    const sizeRange = document.getElementById('size-range');
    const sizeValue = document.getElementById('size-value');

    let savedTheme = 'light';
    try { savedTheme = localStorage.getItem('pizarra-plus-theme') || 'light'; } catch (_) {}
    document.documentElement?.setAttribute('data-theme', savedTheme);
    document.getElementById('theme-toggle').addEventListener('click', () => {
      savedTheme = savedTheme === 'dark' ? 'light' : 'dark';
      document.documentElement?.setAttribute('data-theme', savedTheme);
      try { localStorage.setItem('pizarra-plus-theme', savedTheme); } catch (_) {}
    });
    let currentTool = 'pen'; // 'pen', 'arrow', 'rect', 'ellipse', 'line', 'highlighter', 'eraser'
    let currentColor = '#005fa9';
    document.getElementById('custom-color').addEventListener('input', e => {
      currentColor = e.target.value;
      document.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('active'));
    });
    let currentSize = 6;

    let isDrawing = false;
    let startPoint = null;
    let lastPoint = null;
    let currentStrokeId = null;

    let strokesHistory = [];
    let redoStack = [];

    // Estado OBS y Preview
    let obsMuted = false;
    let obsPreviewActive = false;
    let obsPreviewInterval = null;

    // Relación de aspecto 16:9 (la de la emisión)
    const ASPECT_RATIO = 16 / 9;
    const REF_WIDTH = 1920;
    const REF_HEIGHT = 1080;
    const STAGE_GAP = 8;

    // Largest 16:9 stage that fits the space left after the toolbar. On 4:3 it
    // touches the sides; on 16:9 it shrinks slightly so the bar never covers it.
    function fitStage(availW, availH, barH, gap) {
      const maxH = Math.max(0, availH - barH - gap);
      let w = Math.max(0, availW);
      let h = Math.floor(w * 9 / 16);
      if (h > maxH) {
        h = Math.floor(maxH);
        w = Math.floor(h * 16 / 9);
      }
      return { w: Math.floor(w), h };
    }

    function resizeContainer() {
      const availW = wrapper.clientWidth;
      const availH = wrapper.clientHeight;
      // The toolbar may wrap to two rows on narrow screens: measure it at the
      // stage width it will finally have.
      toolbar.style.width = availW + 'px';
      let barH = toolbar.offsetHeight || 56;
      let stage = fitStage(availW, availH, barH, STAGE_GAP);
      toolbar.style.width = stage.w + 'px';
      const wrappedH = toolbar.offsetHeight || barH;
      if (wrappedH !== barH) {
        barH = wrappedH;
        stage = fitStage(availW, availH, barH, STAGE_GAP);
        toolbar.style.width = stage.w + 'px';
      }
      document.documentElement.style.setProperty?.('--bar-h', barH + 'px');

      const w = stage.w;
      const h = stage.h;
      container.style.width = w + 'px';
      container.style.height = h + 'px';

      const dpr = window.devicePixelRatio || 1;
      const pixelW = Math.floor(w * dpr);
      const pixelH = Math.floor(h * dpr);

      canvas.width = pixelW;
      canvas.height = pixelH;
      previewCanvas.width = pixelW;
      previewCanvas.height = pixelH;

      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.scale(dpr, dpr);
      previewCtx.setTransform(1, 0, 0, 1, 0, 0);
      previewCtx.scale(dpr, dpr);

      redrawAll();
    }

    window.addEventListener('resize', resizeContainer);
    window.addEventListener('orientationchange', () => setTimeout(resizeContainer, 120));

    function getNormalizedPos(e) {
      const rect = canvas.getBoundingClientRect();
      const x = (e.clientX - rect.left) / rect.width;
      const y = (e.clientY - rect.top) / rect.height;
      return {
        x: Math.max(0, Math.min(1, x)),
        y: Math.max(0, Math.min(1, y)),
      };
    }

    function drawItem(seg, targetCtx) {
      const rect = canvas.getBoundingClientRect();
      drawPizarraShape(targetCtx, seg, { width: rect.width, height: rect.height, scale: rect.width / REF_WIDTH });
    }

    function redrawAll() {
      ctx.save();
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.restore();

      for (let i = 0; i < strokesHistory.length; i++) {
        drawItem(strokesHistory[i], ctx);
      }
    }

    function clearPreview() {
      previewCtx.save();
      previewCtx.setTransform(1, 0, 0, 1, 0, 0);
      previewCtx.clearRect(0, 0, previewCanvas.width, previewCanvas.height);
      previewCtx.restore();
    }

    const SHAPE_TOOLS = ['rect', 'ellipse', 'arrow', 'arrow2', 'line'];
    const shapeFill = document.getElementById('shape-fill');
    const shapeDash = document.getElementById('shape-dash');
    function shapeOptions(tool) {
      const options = {};
      if (shapeFill.checked && (tool === 'rect' || tool === 'ellipse')) options.fill = true;
      if (shapeDash.checked && SHAPE_TOOLS.includes(tool)) options.dash = true;
      return options;
    }

    // Text: a small box appears where the user tapped; no browser dialog.
    const textEntry = document.getElementById('text-entry');
    const textInput = document.getElementById('text-entry-input');
    let textPoint = null;
    function openTextEntry(point, clientX, clientY) {
      textPoint = point;
      textEntry.hidden = false;
      const maxLeft = Math.max(8, (window.innerWidth || 800) - 340);
      const maxTop = Math.max(8, (window.innerHeight || 600) - 64);
      textEntry.style.left = Math.min(Math.max(8, clientX), maxLeft) + 'px';
      textEntry.style.top = Math.min(Math.max(8, clientY - 56), maxTop) + 'px';
      textInput.value = '';
      textInput.focus?.();
    }
    function closeTextEntry() {
      textEntry.hidden = true;
      textPoint = null;
    }
    function commitText() {
      const text = String(textInput.value || '').trim().slice(0, 120);
      if (!text || !textPoint) { closeTextEntry(); return; }
      if (!drawingConnected || !ws || ws.readyState !== WebSocket.OPEN) {
        statusText.textContent = 'Sin conexión: el texto no se ha enviado';
        statusText.hidden = false;
        return;
      }
      const item = {
        type: 'pizarra_draw',
        shape: 'text',
        strokeId: 's_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6),
        from: textPoint,
        to: textPoint,
        color: currentColor,
        size: currentSize,
        tool: 'pen',
        text,
      };
      strokesHistory.push(item);
      drawItem(item, ctx);
      sendWs(item);
      redoStack = [];
      closeTextEntry();
    }
    document.getElementById('text-entry-ok').addEventListener('click', commitText);
    document.getElementById('text-entry-cancel').addEventListener('click', closeTextEntry);
    textInput.addEventListener('keydown', event => {
      if (event.key === 'Enter') { event.preventDefault(); commitText(); }
      else if (event.key === 'Escape') closeTextEntry();
    });

    // Interacción táctil y stylus con Pointer Events
    canvas.addEventListener('pointerdown', (e) => {
      if (!drawingConnected || !ws || ws.readyState !== WebSocket.OPEN) {
        statusText.textContent = 'Sin conexión: espera antes de dibujar';
        return;
      }
      if (!pointerOwner.begin(e, allowTouch.checked)) return;
      closeDrawPanel();
      e.preventDefault();
      canvas.setPointerCapture(e.pointerId);
      isDrawing = true;
      if (currentTool === 'text') {
        isDrawing = false;
        openTextEntry(getNormalizedPos(e), e.clientX, e.clientY);
        return;
      }
      startPoint = getNormalizedPos(e);
      lastPoint = startPoint;
      currentStrokeId = 's_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6);

      const isShape = SHAPE_TOOLS.includes(currentTool);

      if (!isShape) {
        // Trazo libre, marcador o borrador: emitir punto inicial
        const seg = {
          type: 'pizarra_draw',
          shape: 'stroke',
          strokeId: currentStrokeId,
          from: { x: startPoint.x, y: startPoint.y },
          to: { x: Math.min(1, startPoint.x + 0.0001), y: Math.min(1, startPoint.y + 0.0001) },
          color: currentColor,
          size: currentSize,
          tool: currentTool,
        };
        strokesHistory.push(seg);
        drawItem(seg, ctx);
        sendWs(seg);
        redoStack = [];
      }
    });

    canvas.addEventListener('pointermove', (e) => {
      if (!pointerOwner.owns(e) || !isDrawing || !lastPoint) return;
      const currentPoint = getNormalizedPos(e);

      const isShape = SHAPE_TOOLS.includes(currentTool);

      if (isShape) {
        // Previsualización fluida de la forma en previewCanvas
        clearPreview();
        const previewItem = {
          from: startPoint,
          to: currentPoint,
          shape: currentTool,
          color: currentColor,
          size: currentSize,
          tool: 'pen',
          ...shapeOptions(currentTool),
        };
        drawItem(previewItem, previewCtx);
      } else {
        // Trazo libre continuo
        const dist = Math.hypot(currentPoint.x - lastPoint.x, currentPoint.y - lastPoint.y);
        if (dist < 0.001) return;

        const seg = {
          type: 'pizarra_draw',
          shape: 'stroke',
          strokeId: currentStrokeId,
          from: lastPoint,
          to: currentPoint,
          color: currentColor,
          size: currentSize,
          tool: currentTool,
        };

        strokesHistory.push(seg);
        drawItem(seg, ctx);
        sendWs(seg);
        lastPoint = currentPoint;
      }
    });

    function endDrawing(e) {
      if (!pointerOwner.end(e) || !isDrawing) return;
      isDrawing = false;
      clearPreview();

      const isShape = SHAPE_TOOLS.includes(currentTool);

      if (e.type !== 'pointercancel' && isShape && startPoint) {
        const endPoint = getNormalizedPos(e) || lastPoint;
        const dist = Math.hypot(endPoint.x - startPoint.x, endPoint.y - startPoint.y);

        // Si hay una distancia mínima detectable, confirmar la forma geométrica
        if (dist > 0.004) {
          const shapeItem = {
            type: 'pizarra_draw',
            shape: currentTool,
            strokeId: currentStrokeId,
            from: startPoint,
            to: endPoint,
            color: currentColor,
            size: currentSize,
            tool: 'pen',
            ...shapeOptions(currentTool),
          };
          strokesHistory.push(shapeItem);
          drawItem(shapeItem, ctx);
          sendWs(shapeItem);
          redoStack = [];
        }
      }

      startPoint = null;
      lastPoint = null;
      currentStrokeId = null;
    }

    canvas.addEventListener('pointerup', endDrawing);
    canvas.addEventListener('pointercancel', endDrawing);

    // Per-device drawing preferences (presentation only; never shared data).
    function readPrefs(store) {
      try {
        const raw = JSON.parse(store.getItem('pizarra-plus-prefs') || '{}');
        const prefs = {};
        if (!raw || typeof raw !== 'object') return prefs;
        if (['pen', 'highlighter', 'line', 'arrow', 'arrow2', 'rect', 'ellipse', 'text', 'eraser'].includes(raw.tool)) prefs.tool = raw.tool;
        if (typeof raw.color === 'string' && /^#[0-9a-f]{6}$/i.test(raw.color)) prefs.color = raw.color;
        if (Number.isInteger(raw.size) && raw.size >= 1 && raw.size <= 40) prefs.size = raw.size;
        if (typeof raw.touch === 'boolean') prefs.touch = raw.touch;
        if (typeof raw.fill === 'boolean') prefs.fill = raw.fill;
        if (typeof raw.dash === 'boolean') prefs.dash = raw.dash;
        return prefs;
      } catch (_) {
        return {};
      }
    }
    function savePrefs() {
      try {
        localStorage.setItem('pizarra-plus-prefs', JSON.stringify({ tool: currentTool, color: currentColor, size: currentSize, touch: allowTouch.checked, fill: shapeFill.checked, dash: shapeDash.checked }));
      } catch (_) {}
    }
    function updateDrawIndicator() {
      if (drawButton.style.setProperty) drawButton.style.setProperty('--current-color', currentColor);
    }

    // Selección de herramientas
    document.querySelectorAll('[data-tool]').forEach((btn) => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('[data-tool]').forEach((b) => b.classList.remove('active'));
        btn.classList.add('active');
        currentTool = btn.dataset.tool;
        savePrefs();
      });
    });

    // Selección de colores
    document.querySelectorAll('.color-swatch').forEach((swatch) => {
      swatch.addEventListener('click', () => {
        document.querySelectorAll('.color-swatch').forEach((s) => s.classList.remove('active'));
        swatch.classList.add('active');

        updateDrawIndicator();
        if (currentTool === 'eraser') {
          document.getElementById('tool-pen').click();
        }
        savePrefs();
      });
    });
    document.getElementById('custom-color').addEventListener('change', () => { updateDrawIndicator(); savePrefs(); });

    // Selección de grosor (control continuo)
    sizeRange.addEventListener('input', () => {

    allowTouch.addEventListener('change', savePrefs);
    shapeFill.addEventListener('change', savePrefs);
    shapeDash.addEventListener('change', savePrefs);

    // Deshacer (Undo)
    document.getElementById('btn-undo').addEventListener('click', () => {
      if (strokesHistory.length === 0) return;
      const lastId = strokesHistory[strokesHistory.length - 1].strokeId;
      const removedGroup = [];

      if (lastId) {
        while (strokesHistory.length > 0 && strokesHistory[strokesHistory.length - 1].strokeId === lastId) {
          removedGroup.unshift(strokesHistory.pop());
        }
      } else {
        removedGroup.unshift(strokesHistory.pop());
      }

      redoStack.push(removedGroup);
      redrawAll();
      sendWs({ type: 'pizarra_undo' });
    });

    // Rehacer (Redo)
    document.getElementById('btn-redo').addEventListener('click', () => {
      if (redoStack.length === 0) return;
      const restoredGroup = redoStack.pop();
      if (!Array.isArray(restoredGroup) || restoredGroup.length === 0) return;

      for (let i = 0; i < restoredGroup.length; i++) {
        const item = restoredGroup[i];
        strokesHistory.push(item);
        drawItem(item, ctx);
        sendWs(item);
      }
    });

    // Limpiar (Clear): a second tap within 3 s confirms, so a brush of the hand
    // never wipes the drawing during a live show. No browser dialog.
    const clearButton = document.getElementById('btn-clear');
    let clearArmedAt = 0;
    let clearTimer = null;
    function clearArmed(armedAt, now) {
      return armedAt > 0 && now - armedAt <= 3000;
    }
    function disarmClear() {
      clearArmedAt = 0;
      clearTimeout(clearTimer);
      clearButton.setAttribute('aria-pressed', 'false');
      clearButton.setAttribute('aria-label', 'Limpiar todo el dibujo');
    }
    clearButton.addEventListener('click', () => {
      const now = Date.now();
      if (!clearArmed(clearArmedAt, now)) {
        clearArmedAt = now;
        clearButton.setAttribute('aria-pressed', 'true');
        clearButton.setAttribute('aria-label', 'Toca otra vez para borrar todo el dibujo');
        clearTimeout(clearTimer);
        clearTimer = setTimeout(disarmClear, 3000);
        return;
      }
      disarmClear();
      ctx.save();
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.restore();
      strokesHistory = [];
      redoStack = [];
      sendWs({ type: 'pizarra_clear' });
    });

    // OBS uses private same-origin request/response, never the public broadcast bus.
    let captureBusy = false;

    function reportObs(message, error = false) {
      obsMessage.textContent = message;
      obsMessage.style.color = error ? 'var(--danger)' : '';
    }
    async function obsRequest(route, body) {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 8000);
      try {
        const response = await fetch('/api/pizarra-plus/obs/' + route, {
          cache: 'no-store', signal: controller.signal,
          ...(body ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) } : {}),
        });
        const data = await response.json();
        if (!response.ok || !data.ok) throw new Error(data.message || 'OBS no completó la petición (' + response.status + ').');
        return data;
      } finally { clearTimeout(timer); }
    }
    function populateSelect(select, values, preferred) {
      const previous = select.value;
      select.replaceChildren();
      for (const value of values) {
        const option = document.createElement('option');
        option.value = value;
        option.textContent = value;
        select.appendChild(option);
      }
      if (values.includes(preferred)) select.value = preferred;
      else if (values.includes(previous)) select.value = previous;
      select.disabled = values.length === 0;
    }
    function updateMute(muted) {

      btnObsMute.disabled = muted === null || actionBusy;

      btnObsMute.setAttribute('aria-pressed', String(muted === false));

    let currentObsScene = '';

    let sourcesCache = [];

    const btnOpenSources = document.getElementById('btn-open-sources');

    const sourcesTitle = document.getElementById('sources-title');
    const sourcesFilter = document.getElementById('sources-filter');
    const sourcesGrid = document.getElementById('sources-grid');
    const sourcesMessage = document.getElementById('sources-message');
    const btnSourcesBack = document.getElementById('btn-sources-back');
    const btnSourcesRefresh = document.getElementById('btn-sources-refresh');

    function renderScenesGrid(scenes, activeScene) {
      currentObsScenes = Array.isArray(scenes) ? scenes : [];
      currentObsScene = activeScene || currentObsScenes[0] || '';
      if (obsScenesGrid) {
        obsScenesGrid.replaceChildren();
        for (const scene of currentObsScenes) {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'scene-btn' + (scene === currentObsScene ? ' active' : '');
          btn.setAttribute('aria-pressed', String(scene === currentObsScene));

          btn.appendChild(title);
          btn.appendChild(sub);
          btn.addEventListener('click', async () => {
            if (actionBusy) return;
            await obsAction('scene', scene);
            if (sourcesSheet && !sourcesSheet.hidden) loadSources(scene);

          obsScenesGrid.appendChild(btn);
        }
      }
      if (btnOpenSources) btnOpenSources.textContent = 'Ver fuentes de ' + (currentObsScene || 'la escena activa');
      if (sourcesTitle) sourcesTitle.textContent = 'Fuentes: ' + (currentObsScene || 'Escena');
    }

    function reportSources(message, error = false) {
      if (!sourcesMessage) return;
      sourcesMessage.textContent = message;
      sourcesMessage.style.color = error ? 'var(--danger)' : '';

    const SVG_EYE_ON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
    const SVG_EYE_OFF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';

    async function loadSources(scene = currentObsScene) {
      if (sourcesBusy) return;
      sourcesBusy = true;
      reportSources('Cargando fuentes de OBS…');
      try {
        const target = scene || currentObsScene;
        const data = await obsRequest('sources' + (target ? '?scene=' + encodeURIComponent(target) : ''));
        sourcesCache = Array.isArray(data.sources) ? data.sources : [];
        if (target) {
          currentObsScene = target;
          if (sourcesTitle) sourcesTitle.textContent = 'Fuentes: ' + target;
        }
        renderSourcesGrid();
        reportSources(sourcesCache.length === 0 ? 'No hay fuentes en esta escena.' : (sourcesCache.length + ' fuentes encontradas.'));
      } catch (error) {
        sourcesCache = [];
        renderSourcesGrid();
        reportSources(error.message, true);
      } finally {
        sourcesBusy = false;
      }
    }

    function renderSourcesGrid() {
      if (!sourcesGrid) return;
      const query = (sourcesFilter && sourcesFilter.value ? sourcesFilter.value : '').trim().toLowerCase();
      const filtered = sourcesCache.filter(s => !query || s.name.toLowerCase().includes(query) || (s.type || '').toLowerCase().includes(query));
      sourcesGrid.replaceChildren();
      for (const source of filtered) {
        const card = document.createElement('div');
        card.className = 'source-card' + (source.enabled ? '' : ' hidden-source');

        const info = document.createElement('div');
        info.className = 'source-info';
        const name = document.createElement('strong');
        name.textContent = source.name;
        const type = document.createElement('small');
        type.textContent = source.type ? source.type.replace(/_/g, ' ') : 'fuente';
        info.appendChild(name);
        info.appendChild(type);

        const eyeBtn = document.createElement('button');
        eyeBtn.type = 'button';
        eyeBtn.className = 'eye-btn' + (source.enabled ? ' visible' : ' hidden-source');
        eyeBtn.setAttribute('aria-pressed', String(source.enabled));
        eyeBtn.setAttribute('aria-label', (source.enabled ? 'Ocultar ' : 'Mostrar ') + source.name);
        eyeBtn.title = (source.enabled ? 'Visible en OBS (tocar para ocultar)' : 'Oculta en OBS (tocar para mostrar)');
        eyeBtn.innerHTML = source.enabled ? SVG_EYE_ON : SVG_EYE_OFF;

        eyeBtn.addEventListener('click', async () => {
          const nextState = !source.enabled;
          source.enabled = nextState;
          eyeBtn.className = 'eye-btn' + (nextState ? ' visible' : ' hidden-source');
          card.className = 'source-card' + (nextState ? '' : ' hidden-source');
          eyeBtn.setAttribute('aria-pressed', String(nextState));
          eyeBtn.setAttribute('aria-label', (nextState ? 'Ocultar ' : 'Mostrar ') + source.name);
          eyeBtn.title = (nextState ? 'Visible en OBS (tocar para ocultar)' : 'Oculta en OBS (tocar para mostrar)');
          eyeBtn.innerHTML = nextState ? SVG_EYE_ON : SVG_EYE_OFF;
          try {
            await obsRequest('action', {
              action: 'toggle_source',
              scene: currentObsScene,
              id: source.id,
              enabled: nextState,
            });
            reportSources('Fuente «' + source.name + '» ' + (nextState ? 'activada' : 'ocultada') + '.');
          } catch (err) {
            source.enabled = !nextState;
            eyeBtn.className = 'eye-btn' + (!nextState ? ' visible' : ' hidden-source');
            card.className = 'source-card' + (!nextState ? '' : ' hidden-source');
            eyeBtn.setAttribute('aria-pressed', String(!nextState));
            eyeBtn.setAttribute('aria-label', (!nextState ? 'Ocultar ' : 'Mostrar ') + source.name);
            eyeBtn.innerHTML = !nextState ? SVG_EYE_ON : SVG_EYE_OFF;
            reportSources('Error: ' + err.message, true);
          }
        });

        card.appendChild(info);
        card.appendChild(eyeBtn);
        sourcesGrid.appendChild(card);
      }
    }

    if (sourcesFilter) sourcesFilter.addEventListener('input', renderSourcesGrid);
    if (btnSourcesRefresh) btnSourcesRefresh.addEventListener('click', () => loadSources(currentObsScene));
    if (btnOpenSources) btnOpenSources.addEventListener('click', () => {

    if (btnSourcesBack) btnSourcesBack.addEventListener('click', () => {

    async function refreshObs() {
      if (stateBusy) return;
      stateBusy = true;
      try {
        let data = await obsRequest('state' + (inputSelect.value ? '?input=' + encodeURIComponent(inputSelect.value) : ''));
        populateSelect(sceneSelect, data.scenes, data.scene);
        populateSelect(inputSelect, data.inputs, inputSelect.value || (data.inputs.includes('Mic/Aux') ? 'Mic/Aux' : data.inputs[0]));
        if (inputSelect.value && data.muted === null) data = await obsRequest('state?input=' + encodeURIComponent(inputSelect.value));
        updateMute(data.muted);
        renderScenesGrid(data.scenes, data.scene);
        reportObs('OBS conectado. Capturas fijas; no vídeo continuo.');
      } catch (error) {
        sceneSelect.disabled = true;
        inputSelect.disabled = true;
        updateMute(null);
        renderScenesGrid([], '');
        reportObs(error.message, true);
      } finally { stateBusy = false; }
    }
    async function obsAction(action, name) {
      if (actionBusy || !name) return;
      actionBusy = true;
      sceneSelect.disabled = true;
      btnObsMute.disabled = true;
      try {
        await obsRequest('action', { action, name });
        await refreshObs();
      } catch (error) {
        await refreshObs();
        reportObs(error.message, true);
      } finally {
        actionBusy = false;
        btnObsMute.disabled = obsMuted === null;
      }
    }
    sceneSelect.addEventListener('change', () => obsAction('scene', sceneSelect.value));
    inputSelect.addEventListener('change', refreshObs);
    btnObsMute.addEventListener('click', () => obsAction('mute', inputSelect.value));
    document.getElementById('btn-obs-refresh').addEventListener('click', refreshObs);

    function scheduleCapture() {

    }
    async function solicitarCapturaObs() {
      if (!obsPreviewActive || document.hidden || captureBusy) return;
      captureBusy = true;
      try {
        const data = await obsRequest('screenshot');
        if (obsPreviewActive && !document.hidden) obsPreviewBg.src = data.image;
        reportObs('Imagen OBS actualizada.');
      } catch (error) { reportObs(error.message, true); }
      finally { captureBusy = false; scheduleCapture(); }
    }
    function setPreviewVisible(visible) {

    const snapshotButton = document.getElementById('btn-obs-snapshot');
    snapshotButton.addEventListener('click', async () => {

      clearTimeout(obsPreviewInterval);

      try { await solicitarCapturaObs(); } finally { snapshotButton.disabled = false; }

    // ── Panels: one open at a time; each control is a single icon ──
    const chatSheet = document.getElementById('chat-sheet');
    const commandsSheet = document.getElementById('commands-sheet');
    const obsSheet = document.getElementById('obs-sheet');
    const sheetButtons = new Map([
      [chatSheet, document.getElementById('btn-chat-view')],
      [commandsSheet, document.getElementById('btn-commands-view')],
      [obsSheet, document.getElementById('btn-obs-menu')],
      [sourcesSheet, document.getElementById('btn-obs-menu')],
    ]);
    function closeDrawPanel() {

    document.addEventListener('keydown', event => {

      }

      closeDrawPanel();
      closeSheets();
      closeSettings();

      if (openSheet(obsSheet)) refreshObs();
    });

    // ── Chat: the Pizarra's own panel. Twitch chat, or the streamer's Botrix
    // widget when "Todos" is on in the server chat configuration (A3). ──
    const TWITCH_CHANNEL = 'apliarte';
    function esUrlBotrix(valor) {
      return typeof valor === 'string' && /^https:\/\/botrix\.live\/[^\s"'<>]*$/i.test(valor.trim());
    }
    function chatUrl(config, host, channel) {
      const todos = !!config && config.todos === true;
      const botrix = config && typeof config.botrixUrl === 'string' ? config.botrixUrl : '';
      if (todos && esUrlBotrix(botrix)) return botrix.trim();
      const parents = [...new Set([host, 'directo.apliarte.com'])].filter(Boolean);
      const query = parents.map(parent => 'parent=' + encodeURIComponent(parent)).join('&');
      return 'https://www.twitch.tv/embed/' + encodeURIComponent(channel) + '/chat?' + query + '&darkpopout';

    const chatFrame = document.getElementById('chat-frame');
    document.getElementById('btn-chat-view').addEventListener('click', async () => {

    // ── Commands: the Pizarra's own panel over the server lists. ──
    const commandsGrid = document.getElementById('commands-grid');
    const commandsMessage = document.getElementById('commands-message');
    const commandsFilter = document.getElementById('commands-filter');
    const cmdStep = document.getElementById('cmd-step');
    const cmdStepTitle = document.getElementById('cmd-step-title');
    const cmdStepChips = document.getElementById('cmd-step-chips');
    const cmdStepInput = document.getElementById('cmd-step-input');
    const cmdSend = document.getElementById('cmd-send');
    const AGENT_CODES = ['co', 'cl', 'ge', 'pi', 'om', 'gr', 'op', 'ex', 'be'];
    let commandsCache = [];
    let savedLists = { usuario: [], canal: [], mensaje: [] };
    let cmdFlow = null;

    function placeholdersOf(template) {
      return [...String(template).matchAll(/\[(usuario|canal|mensaje|agente)\]/g)].map(match => match[1]);
    }
    function buildCommand(template, values) {
      let index = 0;
      return String(template)
        .replace(/\[(usuario|canal|mensaje|agente)\]/g, () => String(values[index++] ?? '').trim())
        .replace(/\s+/g, ' ')
        .trim();
    }
    async function sendCommand(cmd) {
      try {
        const res = await fetch('/api/directo/comando', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ comando: cmd, usuario: 'ja' }),
        });
        let data = {};
        try { data = await res.json(); } catch (_) {}
        if (res.status === 401) return { ok: false, message: 'La sesión ha caducado: vuelve a entrar en el panel.' };
        if (!res.ok) return { ok: false, message: data.error || data.mensaje || ('El servidor respondió ' + res.status + '.') };
        if (data.duplicadoIgnorado) return { ok: true, message: 'Ya se había enviado hace un instante.' };
        if (data.twitchConfigurado === false) return { ok: false, message: 'Twitch no está conectado.' };
        const local = cmd.startsWith('!cam') || cmd === 'adoptar' || cmd === 'liberar';
        if (data.twitchEnviado === false && !local) return { ok: false, message: 'No se envió: ' + (data.error || data.mensaje || cmd) };
        return { ok: true, message: data.mensaje || ('Enviado: ' + cmd) };
      } catch (_) {
        return { ok: false, message: 'Sin conexión con el servidor.' };
      }
    }
    function reportCommands(text, error = false) {
      commandsMessage.textContent = text;
      commandsMessage.dataset.kind = error ? 'error' : 'info';
    }
    async function loadCommands() {
      reportCommands('Cargando comandos…');
      try {
        const [cmdRes, ...listRes] = await Promise.all([
          fetch('/api/panel/comandos-bot', { cache: 'no-store' }),
          ...['usuario', 'canal', 'mensaje'].map(tipo => fetch('/api/panel/lista?tipo=' + tipo, { cache: 'no-store' })),
        ]);
        if (!cmdRes.ok) throw new Error('El servidor respondió ' + cmdRes.status + '.');
        const cmdData = await cmdRes.json();
        commandsCache = Array.isArray(cmdData.comandos) ? cmdData.comandos : [];
        const tipos = ['usuario', 'canal', 'mensaje'];
        for (let i = 0; i < tipos.length; i++) {
          const data = listRes[i].ok ? await listRes[i].json().catch(() => ({})) : {};
          savedLists[tipos[i]] = Array.isArray(data.valores) ? data.valores : [];
        }
        reportCommands(commandsCache.length ? '' : 'No hay comandos guardados. Puedes añadirlos desde Ajustes.');
      } catch (error) {
        commandsCache = [];
        reportCommands('No se pudieron cargar los comandos: ' + error.message, true);
      }
      renderCommands();
    }
    function renderCommands() {
      const filter = commandsFilter.value.trim().toLowerCase();
      commandsGrid.replaceChildren();
      for (const item of commandsCache) {
        const name = Array.isArray(item) ? String(item[0] ?? '') : String(item ?? '');
        const desc = Array.isArray(item) ? String(item[1] ?? '') : '';
        if (!name || (filter && !(name + ' ' + desc).toLowerCase().includes(filter))) continue;
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'cmd-btn';
        const strong = document.createElement('strong');
        strong.textContent = name;
        const small = document.createElement('small');
        small.textContent = desc === '—' ? '' : desc;
        button.append(strong, small);
        button.addEventListener('click', () => startCommand(name));
        commandsGrid.appendChild(button);
      }
    }
    function startCommand(template) {
      cmdFlow = { template, types: placeholdersOf(template), values: [] };
      cmdStep.hidden = false;
      showCommandStep();
    }
    function showCommandStep() {
      const pending = cmdFlow.types[cmdFlow.values.length];
      cmdStepChips.replaceChildren();
      cmdStepInput.value = '';
      const ready = pending === undefined;
      cmdStepInput.parentElement.hidden = ready;
      cmdSend.disabled = !ready;
      if (ready) {
        cmdStepTitle.textContent = '¿Enviar ' + buildCommand(cmdFlow.template, cmdFlow.values) + '?';
        return;
      }
      const labels = { usuario: 'un usuario', canal: 'un canal', mensaje: 'un mensaje', agente: 'un agente' };
      cmdStepTitle.textContent = cmdFlow.template + ': elige ' + labels[pending] + ' o escríbelo.';
      const values = pending === 'agente' ? AGENT_CODES : (savedLists[pending] || []);
      for (const value of values) {
        const chip = document.createElement('button');
        chip.type = 'button';
        chip.className = 'chip';
        chip.textContent = pending === 'usuario' ? '@' + value : value;
        chip.addEventListener('click', () => useCommandValue(value));
        cmdStepChips.appendChild(chip);
      }
    }
    function useCommandValue(value) {
      const clean = String(value || '').trim().replace(/^@/, '');
      if (!cmdFlow || !clean) return;
      cmdFlow.values.push(clean);
      showCommandStep();
    }
    function cancelCommand() {
      cmdFlow = null;
      cmdStep.hidden = true;
    }
    document.getElementById('cmd-step-use').addEventListener('click', () => useCommandValue(cmdStepInput.value));
    cmdStepInput.addEventListener('keydown', event => { if (event.key === 'Enter') useCommandValue(cmdStepInput.value); });
    document.getElementById('cmd-cancel').addEventListener('click', cancelCommand);
    cmdSend.addEventListener('click', async () => {
      if (!cmdFlow || cmdFlow.values.length < cmdFlow.types.length) return;
      const final = buildCommand(cmdFlow.template, cmdFlow.values);
      cmdSend.disabled = true;
      const result = await sendCommand(final);
      reportCommands(result.message, !result.ok);
      if (result.ok) cancelCommand();
      else cmdSend.disabled = false;
    });
    commandsFilter.addEventListener('input', renderCommands);
    document.getElementById('btn-commands-view').addEventListener('click', () => {
      if (openSheet(commandsSheet)) { cancelCommand(); loadCommands(); }
    });

    // ── One Admin engine: hidden by default. It keeps camera, microphone and
    // TTS working; only the gear shows it complete. No second capture. ──
    const adminFrame = document.getElementById('admin-frame');
    const adminDock = document.getElementById('admin-dock');
    const settingsButton = document.getElementById('btn-settings');
    let settingsOpen = false;
    let cameraPreviewHidden = false;
    function syncAdminDock() {
      const doc = adminFrame.contentDocument;
      const camera = doc?.getElementById('camera-push-container');
      const cameraActive = !!camera && camera.style.display !== 'none';
      const showCamera = !settingsOpen && cameraActive && !cameraPreviewHidden;
      adminDock.hidden = !settingsOpen && !showCamera;
      adminDock.classList.toggle('settings', settingsOpen);
      adminDock.classList.toggle('camera-dock', showCamera);
      if (doc?.body && doc.body.classList.contains('plus-camera-only') !== showCamera) doc.body.classList.toggle('plus-camera-only', showCamera);
    }
    function closeSettings() {
      if (!settingsOpen) return;
      settingsOpen = false;
      settingsButton.setAttribute('aria-expanded', 'false');
      syncAdminDock();
    }
    document.getElementById('btn-settings').addEventListener('click', () => {
      const open = !settingsOpen;
      closeDrawPanel();
      closeSheets();
      settingsOpen = open;
      settingsButton.setAttribute('aria-expanded', String(open));
      syncAdminDock();
    });
    document.getElementById('btn-settings-close').addEventListener('click', () => {
      closeSettings();
      settingsButton.focus();
    });
    document.getElementById('btn-camera-preview-close').addEventListener('click', () => {
      cameraPreviewHidden = true;
      syncAdminDock();
    });

    adminFrame.addEventListener('load', () => {
      try {
        const doc = adminFrame.contentDocument;
        const style = doc.createElement('style');
        style.textContent = `
          body.plus-camera-only {padding:0!important;margin:0!important;overflow:hidden!important;background:#303030!important;}
          body.plus-camera-only > :not(#tab-directo) {display:none!important;}
          body.plus-camera-only #tab-directo {display:block!important;padding:0!important;margin:0!important;}
          body.plus-camera-only #tab-directo > :not(#card-camara-modo) {display:none!important;}
          body.plus-camera-only #card-camara-modo {padding:0!important;margin:0!important;border:0!important;}
          body.plus-camera-only #card-camara-modo > :not(#camera-push-container) {display:none!important;}
          body.plus-camera-only #camera-push-container {margin:0!important;border:0!important;border-radius:0!important;}
          body.plus-camera-only #camera-push-container > :not(#camera-preview-wrapper) {display:none!important;}`;
        doc.head.appendChild(style);
        const camera = doc.getElementById('camera-push-container');
        if (camera && typeof MutationObserver !== 'undefined') new MutationObserver(syncAdminDock).observe(camera, { attributes: true, attributeFilter: ['style'] });
        syncAdminDock();
      } catch (_) {}
    });

    const tabletMicButton = document.getElementById('btn-tablet-mic');
    tabletMicButton.addEventListener('click', () => {
      const original = adminFrame.contentDocument?.getElementById('btn-micro-toggle');
      if (original && !original.disabled) original.click();
    });
    const cameraCaptureButton = document.getElementById('btn-device-camera');
    cameraCaptureButton.addEventListener('click', () => {
      const doc = adminFrame.contentDocument;
      const stop = doc?.getElementById('btn-apagar-camara');
      const start = doc?.getElementById('btn-toggle-camara-modo');
      const active = !!stop && stop.style.display !== 'none';
      if (active && cameraPreviewHidden) {
        // First tap brings the preview back; it never stops the camera by surprise.
        cameraPreviewHidden = false;
        syncAdminDock();
        syncCameraButton();
        return;
      }
      const original = active ? stop : start;
      if (original && !original.disabled) {
        cameraPreviewHidden = false;
        original.click();
      }
    });
    const ttsButton = document.getElementById('btn-tts');
    ttsButton.addEventListener('click', () => {
      const original = adminFrame.contentDocument?.getElementById('btn-tts-main-toggle');
      if (original && !original.disabled) original.click();
    });
    let syncCameraButton = () => {};
    adminFrame.addEventListener('load', () => {
      const doc = adminFrame.contentDocument;
      if (!doc) return;
      const mic = doc.getElementById('btn-micro-toggle');
      const micBadge = doc.getElementById('badge-micro-estado');
      const syncMic = () => {
        tabletMicButton.disabled = !mic || mic.disabled;
        const state = (micBadge?.textContent?.trim() || 'estado desconocido').replace(/[\p{Extended_Pictographic}️]/gu, '').trim();
        tabletMicButton.setAttribute('aria-label', 'Micrófono de este dispositivo: ' + state);
        tabletMicButton.setAttribute('aria-pressed', String(state === 'EN VIVO'));
      };
      syncMic();
      if (micBadge) new MutationObserver(syncMic).observe(micBadge, { childList: true, subtree: true, characterData: true });
      if (mic) new MutationObserver(syncMic).observe(mic, { attributes: true, attributeFilter: ['disabled'] });

      const stop = doc.getElementById('btn-apagar-camara');
      const start = doc.getElementById('btn-toggle-camara-modo');
      syncCameraButton = () => {
        const active = !!stop && stop.style.display !== 'none';
        cameraCaptureButton.disabled = !start || !stop || (active ? stop.disabled : start.disabled);
        const label = !active ? 'Activar cámara de este dispositivo' : (cameraPreviewHidden ? 'Mostrar la vista de cámara' : 'Apagar cámara de este dispositivo');
        cameraCaptureButton.setAttribute('aria-label', label);
        cameraCaptureButton.setAttribute('aria-pressed', String(active));
        syncAdminDock();
      };
      syncCameraButton();
      for (const target of [start, stop]) {
        if (target) new MutationObserver(syncCameraButton).observe(target, { attributes: true, attributeFilter: ['style', 'disabled'] });
      }

      const tts = doc.getElementById('btn-tts-main-toggle');
      const ttsBadge = doc.getElementById('badge-tts-estado');
      const syncTts = () => {
        ttsButton.disabled = !tts || tts.disabled;
        const on = (ttsBadge?.textContent || '').trim() === 'Escuchando en vivo';
        ttsButton.setAttribute('aria-pressed', String(on));
        ttsButton.setAttribute('aria-label', on ? 'Voz del chat (TTS) activada: pulsa para detenerla' : 'Voz del chat (TTS) apagada: pulsa para activarla');
      };
      syncTts();
      if (ttsBadge) new MutationObserver(syncTts).observe(ttsBadge, { childList: true, subtree: true, characterData: true });
    });

    // Private same-origin drawing channel; the original :8790 channel is unchanged.
    let ws = null;
    let reconnectTimeout = null;

    function getWsUrl() {
      const proto = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
      return `${proto}//${window.location.host}/pizarra-plus/ws`;
    }

    function sendWs(payload) {
      if (ws && ws.readyState === WebSocket.OPEN) {
        try {
          ws.send(JSON.stringify(payload));
        } catch (_) {}
      }
    }

    let drawingConnected = false;
    function connectWs() {
      drawingConnected = false;
      if (ws) {
        try { ws.close(); } catch (_) {}
      }

      statusDot.className = 'status-dot';
      statusText.textContent = 'Conectando...';
      statusText.hidden = false;

      const url = getWsUrl();
      try {
        ws = new WebSocket(url);
      } catch (e) {
        scheduleReconnect();
        return;
      }

      ws.onopen = () => {
        statusText.textContent = 'Conectando al centro de dibujo...';
        sendWs({ type: 'pizarra_solicitar_estado' });

      };

      ws.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);
          if (!data || !data.type) return;

          if (data.type === 'pizarra_init' && Array.isArray(data.history)) {
            drawingConnected = true;
            statusDot.className = 'status-dot online';
            statusText.textContent = 'Pizarra conectada';
            statusText.hidden = true;
            strokesHistory = data.history.slice();
            redrawAll();
          } else if (data.type === 'pizarra_draw') {
            strokesHistory.push(data);
            drawItem(data, ctx);
          } else if (data.type === 'pizarra_clear') {
            const rect = canvas.getBoundingClientRect();
            ctx.clearRect(0, 0, rect.width, rect.height);
            strokesHistory = [];
            redoStack = [];
          } else if (data.type === 'pizarra_undo') {
            if (strokesHistory.length > 0) {
              const lastId = strokesHistory[strokesHistory.length - 1].strokeId;
              if (lastId) {
                while (strokesHistory.length > 0 && strokesHistory[strokesHistory.length - 1].strokeId === lastId) {
                  strokesHistory.pop();
                }
              } else {
                strokesHistory.pop();
              }
              redrawAll();
            }
          }
        } catch (_) {}
      };

      ws.onclose = () => {
        drawingConnected = false;
        statusDot.className = 'status-dot';
        statusText.textContent = 'Sin conexión: reconectando…';
        statusText.hidden = false;
        scheduleReconnect();
      };

      ws.onerror = () => {
        statusDot.className = 'status-dot';
        statusText.textContent = 'Sin conexión con el centro de dibujo';
        statusText.hidden = false;
        scheduleReconnect();
      };
    }

    function scheduleReconnect() {
      if (reconnectTimeout) return;
      reconnectTimeout = setTimeout(() => {
        reconnectTimeout = null;
        connectWs();
      }, 2000);
    }

    // Pointer precision only changes button size between strokes, never mid-stroke.
    let pendingResize = false;
    document.addEventListener('pointerdown', event => {
      // Detect the actual pointer, not a guessed tablet user agent.
      if (isDrawing && event.pointerType !== 'pen') return;
      const next = event.pointerType === 'pen' ? 'pen' : event.pointerType === 'touch' ? 'touch' : 'mouse';
      if (document.documentElement.dataset.precision !== next) {
        document.documentElement.dataset.precision = next;
        pendingResize = true;
      }
    }, { passive: true });
    document.addEventListener('pointerup', () => {
      if (pendingResize && !isDrawing) { pendingResize = false; resizeContainer(); }
    }, { passive: true });

    // Restore this device's drawing preferences.
    (() => {
      let store = { getItem: () => null };
      try { store = localStorage; } catch (_) {}
      const prefs = readPrefs(store);
      if (prefs.tool) document.getElementById('tool-' + prefs.tool)?.click();
      if (prefs.color) {
        currentColor = prefs.color;
        document.querySelectorAll('.color-swatch').forEach(s => s.classList.toggle('active', s.dataset.color === prefs.color));
        document.getElementById('custom-color').value = prefs.color;
      }
      if (prefs.size) {
        currentSize = prefs.size;
        sizeRange.value = String(prefs.size);
        sizeValue.textContent = String(prefs.size);
      }
      if (prefs.touch !== undefined) allowTouch.checked = prefs.touch;
      if (prefs.fill !== undefined) shapeFill.checked = prefs.fill;
      if (prefs.dash !== undefined) shapeDash.checked = prefs.dash;
      updateDrawIndicator();
    })();

    // Load the Admin engine only; camera/microphone/TTS still require a tap.
    adminFrame.src = adminFrame.dataset.src;
    resizeContainer();
    connectWs();
  </script>
</body>
</html>
